# Seed Spec — 티켓 배경 이미지 배율 컨트롤 (#680)
# 이력: #530(기하 프리셋) → #671(사용자 업로드) → #672(프리셋 제거) → #680(이 스펙, 배율) →
# #728(docs/specs/background-to-stamp.yaml, 전면 cover를 무드별 고정 박스 '스탬프'로 재설계).
# #728 이후 이 스펙의 c1(clip·배율 두 겹)·c3(상한 1.5 근거인 "전면을 채우느라 1534로 굽는다")·
# c5(하한 1.0)·c6(오프셋 안 열기)은 **전면 cover 배경을 전제**로 쓰인 절이라 stale하다(P15) —
# 폐기하지 않고 이 한 줄만 남긴다. 배율 UI 자체(BrightnessSlider 재사용·범위 1.0~1.5)는
# #728에서도 그대로 살아 있으니 절 전체가 무효는 아니다.

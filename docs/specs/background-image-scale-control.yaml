blindspots:
  - area: blind-spots
    question: >-
      transform: scale이 iOS Safari 저장물의 배경 누락 리스크를 키우는가? backgroundPatterns.ts:14-19이
      이미 "CSS background-image는 포스터·로고가 쓰는 compositeRaster 탈출구가 없어 iOS가 조용히
      떨어뜨릴 수 있다"를 미확인 리스크로 인계해뒀고, macOS Chrome 하네스로는 원리적으로 못 보는
      축이다. 이번 스펙은 그 위에 transform을 하나 더 얹는다. 실기기 저장 확인은 이 스펙의 완료
      조건에서 의도적으로 제외했고 #672 머지 조건으로 남긴다 — 배율이 그 리스크를 만든 게 아니라
      물려받는 것이기 때문이다.


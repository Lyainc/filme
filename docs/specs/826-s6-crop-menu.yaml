    rationale: "맹점 1(소유자 채택 2026-11-23): 지금 usePosterCrop.openFile은 새 originalSrc를 세우는 즉시 effect가 이전 원본을 revoke하고(usePosterCrop.ts:58-71), cancel은 pendingNewFile이면 originalSrc를 null로 만든다(:117-121). D20-1 전에는 다시 자르기 안에서 파일을 바꾸는 길이 없었다."
  - id: constraint-19
    type: technical
    description: "'다른 사진'의 파일 입력은 크롭 화면 안에 산다: 크롭 화면이 자기 숨은 input[type=file](호출부의 원래 업로드와 같은 accept)을 갖고, 고른 파일을 호출부에 넘겨 그 호출부의 열기 경로(usePosterCrop.openFile · useLogoCrop.openFile 등)로 크롭을 다시 시작한다. 크롭 화면 뒤의 inert 영역(#685)에 있는 기존 파일 입력을 click()으로 부르지 않는다. 이 숨은 입력은 tabIndex=-1로 Tab 순환 · 첫/끝 판정에서 빠지고, 접근 이름은 바깥 업로드 입력과 겹치지 않는다. 고른 파일이 이미지가 아니면 선택 취소와 같이 크롭 화면을 그대로 둔다."
    hard: true
    rationale: "맹점 2(소유자 채택 2026-11-23): 기존 입력은 모두 크롭 화면 뒤(MobileEditorShell.tsx:845-857 APP_BACKGROUND_ID 안, PhotoPane.tsx:110-141, InPlaceFieldEditor.tsx:790-799)에 있고 useBodyScrollLock이 그 영역을 inert로 만든다. inert 입력의 click()이 iOS에서 사진 선택을 여는지는 실측되지 않았다."
  - id: constraint-20
    type: technical
    description: "실패 상태와 제목의 주인: 크롭 훅(usePosterCrop · useLogoCrop)은 자르기 실패를 토스트가 아니라 상태(예: cropError)로 돌려주고 새 파일 · 다시 시도 · 닫기에서 비우며, useLogoCrop은 실패 때 크롭 화면을 닫지 않는다. 크롭 화면은 그 상태와 자기 이미지 로드 실패를 constraint-9의 경고 하나로 보인다. 호출부는 대상 → 제목을 한 표(포스터 · 극장/포맷 로고 · 서명 · 배경 스탬프)에서 골라 넘기고, 같은 useLogoCrop을 극장 · 포맷 로고와 서명이 함께 쓰는 InPlaceFieldEditor는 지금 편집 중인 필드로 제목을 고른다. FieldEditorBody도 같은 표를 쓴다."
    hard: true
    rationale: "맹점 3(소유자 채택 2026-11-23): 실패 토스트가 훅 안에 있고(usePosterCrop.ts:103 · useLogoCrop.ts:49), useLogoCrop은 실패 때 setRawSrc(null)로 닫으며(:50), InPlaceFieldEditor(:443 · :804)와 FieldEditorBody(:558-560)는 '로고 크롭'을 박아 두었다."


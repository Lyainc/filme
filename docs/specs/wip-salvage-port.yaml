  - id: c5
    type: other
    hard: true
    description: main의 근거 주석(이슈 번호와 이유를 적은 주석)은 보존한다. 옮기는 로직과 직접 연결된 주석만 고치고, 삭제된 기능(형압·배경 타일)의 주석만 같이 지운다.
    rationale: 코드는 멀쩡해도 근거가 사라지면 다음 수정자가 같은 실수를 반복한다(예 OcrUploadCard의 #727·#737 순서 불변식).
  - id: c6
    type: technical
    hard: true
    description: 항목마다 목적 하나짜리 PR로 옮긴다. Conventional Commits에 (#N)을 붙이고, 테스트와 필요한 문서 수정을 같은 PR에 넣는다. rebase merge 기준이다.
    rationale: CLAUDE.md Git 규칙과 P21(원자적 커밋).
  - id: c7
    type: technical
    hard: true
    description: 형압 제거 PR은 레일 슬롯 근거(#682의 형압 넘침 상태), CLAUDE.md 하네스 절, COPY_TONE_GUIDE의 형압 안내(#692) 잠금 문구와 삭제 테스트 참조까지 같이 정리한다.
    rationale: 문서와 테스트가 삭제된 기능을 계속 가리키면 규칙이 조용히 어긋난다(빈틈 점검).
  - id: c8

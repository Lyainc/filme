    hard: true
    description: 새 사용자 노출 문구는 docs/COPY_TONE_GUIDE.md 규칙을 따른다(p7 안내문·버튼 라벨).
    rationale: 레포 문구 규칙.
  - id: c9
    type: technical
    hard: false
    description: WIP 코드는 참고 구현이다. main 쪽 최근 수정(#757/#761/#762/#768, 포커스 복원 040f81b)과 겹치는 파일은 main을 기준으로 hunk 단위로 옮긴다.

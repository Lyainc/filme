blindspots:
  - area: blind-spots
    question: >
      MoodCriterion.tsx:336의 signature도 똑같은 containsHangul 자동분기를 쓴다. quote만 폰트를
      열면 같은 카드 안에서 한줄평=고딕 / 서명=손글씨 같은 조합이 나오는데, 그게 허용 가능한
      결과인가 — 아니면 quoteFont가 signature에도 함께 걸려야 하나?
  - area: edge-cases
    question: >
      아이스자람체는 preload:false 지연 로드다. 지금까지는 "한글 입력 → 렌더"가 로드 시간을
      벌어줬는데, 이제 칩을 탭한 직후 저장이 가능하다. captureToImage의 document.fonts.ready
      대기가 아직 요청조차 안 된 폰트를 기다려주는가? (_shared.tsx:1828의 폰트 로드 완료 판정
      헬퍼가 #318에서 같은 함정을 다룬 적 있다)
    resolved: >
      재현 안 됨 — 캡처 경로 수정 불필요(400×675 Chrome 실측, woff2 응답 8초 지연).
      (1) 프리뷰가 debounce 280ms 뒤 새 폰트로 렌더된 다음에야 저장 화면에 닿으므로 캡처 시점엔
      face가 loading이고 fonts.ready가 pending이다 — 저장 클릭 시 document.fonts.status='loading',
      캡처가 24.6초 걸린 뒤 손글씨 글리프로 나왔다.
      (2) 독립된 안전망: html-to-image getWebFontCSS가 @font-face URL을 스스로 받아 SVG에
      인라인하고, 그 대상 판정이 클론 노드의 computed fontFamily라 로드 상태와 무관하다.
      근거는 captureToImage.ts의 fonts.ready 주석에 함께 남겼다.
  - area: trade-offs
    question: >
      이 이슈가 appliesTo의 첫 실사용 사례다(#530보다 먼저 도착). Criterion↔타 무드 전환 때
      레일 캐러셀 아이콘이 6↔5개로 변해 중앙정렬·스크롤 위치가 재계산되는데, 사용자가 위치로
      기억하는 항목이 움직이는 게 허용 가능한가? #502 캐러셀은 이 상황에서 검증된 적 없다.


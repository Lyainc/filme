goal:
  statement: >
    디자인 레일에 무드 전용 커스터마이즈를 담는 '커스텀' 항목을 신설하고, 그 첫 내용물로
    Criterion 한줄평(quote)의 한글 폰트를 사용자가 고를 수 있게 한다 — 폰트 파일 추가 없이
    이미 로드된 3종(아이스자람체·Pretendard·Instrument Serif)에 '자동'을 더한 4택으로.
  clarity_score: 0.9

constraints:
  - id: c1
    type: technical
    description: >
      RailItem.appliesTo는 항목 안에 든 컨트롤들의 노출 무드 **합집합**으로 두고, 컨트롤별
      게이팅은 render 안에서 각자 무드 표를 다시 본다. 이번엔 quote 하나뿐이라
      appliesTo: ['criterion'], #530 배경 패턴이 합류하면 ['editorial','criterion','stub']로
      넓어지고 Editorial에서 커스텀을 열면 배경 패턴만 뜬다.
    hard: true
    rationale: >
      appliesTo는 filterItemsForMood가 쓰는 **항목 단위** 필터라 한 항목에 노출 범위가 다른
      컨트롤이 둘 들어가면 좁은 쪽이 죽은 컨트롤이 된다. 레포에 이미 같은 처방이 있다 —
      SizePanel의 showFit(POSTER_FILL_MOODS)이 항목은 전 무드에 두고 컨트롤만 게이팅한다.
      항목을 둘로 쪼개는 대안은 레일 아이콘이 7개로 늘어 캐러셀 재배치 폭이 커진다.

  - id: c2
    type: technical
    description: >
      새 폰트 파일 0건. 피커 선택지는 이미 _app.tsx가 로드하는 폰트만으로 채운다 —
      자동 / 손글씨(FONT_QUOTE_KR=아이스자람체) / 고딕(FONT_KR=Pretendard) /
      세리프(FONT_DISPLAY=Instrument Serif) 4택.
    hard: true
    rationale: >
      #437이 산정한 실비용은 폰트 파일 무게(각 3~4MB, 한글은 완성형 전 글리프라 서브셋 난망)와
      눈누 임베딩 라이선스 개별 확인이다. 그 둘을 이번 범위에서 통째로 뺀다. 후보 추가는
      state·피커·렌더 매핑이 이미 서 있는 상태에서 목록에 줄만 얹는 후속 PR이 된다.

  - id: c3
    type: technical
    description: >
      선택값 우선, 미선택(기본값 'auto')이면 현행 containsHangul 자동분기로 폴백.
      containsHangul 분기 자체는 걷어내지 않는다.
    hard: true
    rationale: >
      #437 수정계획 2번 권장안. 자동분기를 폐기하면 영문 quote의 기본 룩(Instrument Serif)이
      바뀌어 Criterion v5 시안 충실성(#524)이 깨진다. 기본값을 'auto'로 두면 기존 사용자의
      렌더가 한 픽셀도 안 변한다.

  - id: c4
    type: technical
    description: >
      한줄평에 한글이 포함되면 '세리프' 칩만 disabled + 사유 문구(disabledNote)를 띄운다.
      숨기지 않고 잠근다.
    hard: true
    rationale: >
      Instrument Serif는 한글 글리프가 없어 시스템 세리프 폴백으로 깨진다. 개념 자체는 있으니
      "숨김"이 아니라 "잠금" — ColorPicker가 TONE_FIXED_MOODS를 disabled+disabledNote로 다루는
      것과 같은 문법이고, 그래서 판정도 appliesTo가 아니라 render 클로저 안에 있다.

  - id: c5
    type: technical
    description: >
      모바일 커스텀 패널에는 **폰트 피커만** 둔다. 한줄평 텍스트 편집은 지금처럼 온티켓
      FieldTap → InPlaceFieldEditor 경로를 유지한다.
    hard: true
    rationale: >
      레일은 하단 고정 dock(MobileEditorShell.tsx:821, #357)이라 텍스트 인풋을 넣으면 소프트
      키보드가 dock을 통째로 덮는다. 온티켓 인플레이스 편집기가 이미 그 문제를 피하려고 있는
      경로다. 대신 한줄평 컨트롤이 두 자리로 갈리는 대가를 진다.

  - id: c6
    type: other
    description: >
      데스크톱은 이번 개발 범위 밖. RAIL_ITEMS가 두 셸 공용이라 커스텀 항목은 DesktopDesignPanel에
      자동으로 딸려가지만, 시안 판정·dock 예산·육안 검증은 모바일만 본다.
      **알려진 회귀를 감수한다**: MOOD_EXCLUDED_FIELDS에서 quote를 전 무드 제외로 바꿔 데스크톱
      FieldAccordion Film 그룹에서 빼면, 데스크톱엔 온티켓 FieldTap이 없어 quote 텍스트 편집
      경로가 0개가 된다. 데스크톱 작업 시 복구한다.
    hard: true
    rationale: >
      사용자 결정(Round 1 '런처에서 제거' + Round 4 '데스크톱 회귀 무시'). surface별 분기로
      데스크톱에만 텍스트 인풋을 주는 대안이 있었으나 범위 밖으로 미뤘다.

  - id: c7
    type: technical
    description: >
      TicketComponents에 폰트 선택 필드 하나 추가(예: quoteFont, 기본 'auto') + INITIAL_STATE.
      마이그레이션 없음 — 필드가 없으면 `?? 'auto'`로 읽는다.
    hard: false
    rationale: >
      순수 추가다. migrateLegacyComponents(textureRecipes.ts:210)가 있는 건 texture 단일축이
      2축으로 쪼개지며 값이 재해석돼야 했기 때문이고 여기는 해당 없다. #530의 backgroundPattern
      추가와 같은 논리.

  - id: c8
    type: technical
    description: >
      QUOTE_MAX_LENGTH = 22는 그대로 둔다. 폰트별 재도출 불필요.
    hard: false
    rationale: >
      fields.ts:175 주석이 "한글 손글씨 50px advance ≈ 1em" 최악 기준으로 도출한 값이다.
      Pretendard 한글도 같은 1em이고 Instrument Serif는 라틴이라 더 좁아, 4택 어느 쪽도
      기존 상한을 넘지 않는다. (검증 완료 — 이 스펙에서 확인)

  - id: c9
    type: technical
    description: >
      공유 파이프라인은 손대지 않는다.
    hard: false
    rationale: >
      /api/ticket.ts는 TicketComponents를 직렬화하지 않고 **캡처된 JPEG**를 blob에 올린다.
      폰트는 캡처 시점에 픽셀로 박혀 나가므로 공유 링크·OG 카드에 별도 배선이 필요 없다.
      (#437 수정계획 1번의 "공유 blob JSON 직렬화 확장"은 이 레포 현실과 안 맞는다 — 검증 완료)

success_criteria:
  - id: ac1
    description: >
      레일 커스텀 패널에서 폰트를 고르면 Criterion 렌더의 한줄평 fontFamily가 바뀌고,
      Criterion 밖 무드에서는 커스텀 항목 자체가 레일에 안 뜨며, 무드를 왕복해도 선택값이 보존된다.
    verifiable: true
    measurable_via: >
      __tests__/ 신규 상호작용 테스트 (happy-dom + testing-library + user-event).
      #523이 만든 filterItemsForMood 필터 테스트 재사용.

  - id: ac2
    description: >
      캡처 산출물이 프리뷰와 동일하다 — 4택 각각 선택 → 저장 → JPEG와 프리뷰 스크린샷 육안 대조.
      선택 직후 즉시 저장해도 폰트가 산출물에 실린다.
    verifiable: true
    measurable_via: bun run dev → 모바일 뷰포트 → 4조합 육안 대조 + PR 스크린샷 첨부

  - id: ac3
    description: >
      400×675 뷰포트에서 커스텀 패널을 열었을 때 dock 높이와 프리뷰 티켓 px가 #500·#554가 잡아둔
      예산 안에 있다(후보정 312px / 크기 축 전환 이후 값 기준). 폰트 피커가 새 최댓값을 만들지 않는다.
    verifiable: true
    measurable_via: 브라우저 실측 — dock rect 높이 + 티켓 프레임 rect. PR에 수치 기재.

  - id: ac4
    description: 기본값 'auto'에서 기존 렌더가 한 픽셀도 안 변한다.
    verifiable: true
    measurable_via: bun test && bun run typecheck + Criterion 렌더 스냅샷 육안


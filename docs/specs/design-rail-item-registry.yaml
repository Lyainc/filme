  - id: ac3
    description: >-
      appliesTo 필터에 유닛 테스트가 붙는다 — appliesTo 없는 항목은 모든 무드에서 노출,
      있는 항목은 해당 무드에서만 노출, 그 밖에서는 숨김.
    verifiable: true
    measurable_via: 신규 테스트에서 합성(가짜) 항목으로 필터 함수 직접 호출

  - id: ac4

goal:
  statement: >-
    지금 네 곳(Pop union · RAIL_ITEMS · 삼항 체인 · 데스크톱 Section 스택)에 흩어져 있는
    디자인 레일 항목 정의를 목록 한 곳으로 모아, 새 항목 추가(무드별 전용 항목 포함)가
    파일 한 곳 수정으로 끝나고 데스크톱·모바일 양쪽에 자동 반영되게 한다.
  clarity_score: 0.80

constraints:
  - id: c1
    type: technical
    description: >-
      항목 정의는 id · label · eyebrow · icon · render · appliesTo?(LayoutId[])를 한 덩어리로
      갖는다. 데스크톱·모바일은 이 목록만 공유하고 배치는 각자 유지한다
      (모바일 = 아이콘 행 + 단일 확장 패널, 데스크톱 = 상시 확장 세로 스택).
    hard: true
    rationale: >-
      배치까지 통일하면 UX 변경이 섞여 무회귀 판정이 불가능해진다. 목록만 공유해도
      "항목 추가 = 한 곳" 목표는 달성된다.

  - id: c2
    type: technical
    description: >-
      render는 화면을 인자로 받는다 — render: (photo, surface) => ReactNode.
      무드 항목만 surface로 분기하고(모바일 LayoutStrip / 데스크톱 LayoutPicker),
      슬라이더 id는 `${prefix}-chain-scale` 식으로 조립해 기존 id
      (rail-chain-scale · desktop-chain-scale 등)를 바이트 단위로 보존한다.
    hard: true
    rationale: >-
      두 화면은 같은 항목이어도 실제 렌더 내용이 다르다(DesignRail.tsx:214 LayoutStrip vs
      DesktopDesignPanel.tsx:42 LayoutPicker). 게다가 desktop-chain-scale은
      __tests__/desktopDesignPanel.test.tsx:80이 CSS 선택자로 잡고 있어, id가 바뀌면
      ac1(기존 테스트 무수정 통과)이 곧바로 깨진다.

  - id: c3
    type: technical
    description: >-
      appliesTo로 숨겨진 항목의 상태값은 보존한다. UI에서만 사라지고 저장된 값은 안 건드려서,
      그 무드로 돌아오면 설정이 그대로 복원된다.
    hard: true
    rationale: >-
      레포 선례와 일치 — chainScale은 minimal 무드에서 표시만 클램프하고 raw 값을 보존한다
      (DesignRail.tsx:188-195, claude-review PR #486 P1 2차). 여기서 리셋을 택하면 같은
      제품 안에 서로 다른 규칙 두 개가 생긴다.

  - id: c4
    type: technical
    description: >-
      "숨김"과 "잠금"은 서로 다른 메커니즘으로 유지하고 기준을 문서화한다.
      appliesTo = 그 무드에는 개념 자체가 없는 항목(레일에서 숨김).
      disabled + 안내문 = 개념은 있으나 그 무드가 값을 고정한 경우(보이되 잠금).
      35mm의 컬러는 후자이므로 지금 방식을 그대로 둔다.
    hard: false
    rationale: >-
      35mm 컬러는 disabledNote로 "왜 못 바꾸는지"를 설명하고 있다(DesignRail.tsx:220-222,
      DesktopDesignPanel.tsx:95-96). appliesTo로 이관하면 아이콘이 그냥 사라져 이유가 유실된다.
      두 방식이 공존하는 게 맞고, 다만 기준이 없으면 다음 사람이 아무거나 고른다.

  - id: c5
    type: technical
    description: >-
      삼항 체인의 무조건 final else를 명시적 조회로 바꾼다. 모바일에서 패널이 열린 채
      무드가 바뀌어 그 항목이 appliesTo에 걸리면 패널을 닫는다(pop → null).
    hard: true
    rationale: >-
      현재 DesignRail.tsx:283의 final else는 매칭 안 되는 id가 오면 조용히 '크기' 패널을
      렌더한다. lastPopRef(:181-184)가 pop이 null이 된 뒤에도 직전 항목을 붙들고 eyebrow를
      `?? ''`로 폴백하므로, appliesTo가 들어오면 이름 없는 region에 엉뚱한 패널이 뜬다.

  - id: c6
    type: temporal
    description: 이 이슈가 #502(레일 → 중앙정렬 캐러셀)보다 먼저 머지된다. #502에 의존 코멘트를 단다.
    hard: true
    rationale: >-
      둘 다 RAIL_ITEMS와 RailExpandPanel을 건드린다. 목록을 먼저 한 곳으로 모으면 #502는
      "그 목록을 어떻게 뿌릴지"만 바꾸는 작업이 돼 범위가 줄어든다. 순서가 반대면 캐러셀
      코드를 다시 해체해야 한다.

  - id: c7
    type: technical
    description: >-
      무드별 옵션의 실제 내용물은 이 이슈 범위 밖(별도 기획). appliesTo는 로직·타입·테스트까지
      구현하되 실제로 쓰는 항목은 0개인 상태로 머지된다.
    hard: true
    rationale: >-
      그릇과 내용물을 한 PR에 섞으면 무회귀 판정(ac1)이 성립하지 않는다. 필터는 순수 함수라
      합성 항목만으로 검증 가능하므로, 검증되지 않은 채 남는 부분도 없다.


      모바일에서 패널이 열린 채 무드를 바꿔 그 항목이 숨겨지면 패널이 닫히고, 숨겨진 항목의
      상태값은 보존돼 그 무드로 복귀 시 그대로 복원된다.
    verifiable: true
    measurable_via: 신규 상호작용 테스트(happy-dom + testing-library) — 합성 항목 기준


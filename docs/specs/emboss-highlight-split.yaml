    azimuth 235 / elevation 50 단일 광원). 확산 반사는 표면이 광원 쪽으로 기울면 밝아지고
    반대로 기울면 **덜 밝아질 뿐 어두워지지 않는다** — 그래서 결과가 부드러운 광택이지 양감이
    아니다. 볼록 압인이 서려면 경사면의 부호가 갈려 밝은 면과 어두운 면이 마스크 경계의 서로
    반대편에 **동시에** 서야 한다. 이름과 룩이 어긋난 상태를 이름 쪽으로 정리하고(하이라이트),
    비어 있는 자리에 진짜 형압을 넣는 것이 이 에픽이다.
  decomposition:
    - id: d1
      title: 현행 효과를 '하이라이트'로 개명 + 하네스 복구
      target: >-
        사용자 노출 문자열, 레일 항목 라벨/id, 그리고 개명에 딸려 깨지는 하네스 셀렉터.
      scope:
        - >-
          src/ 안의 '형압' 문자열 44곳(실측 `grep -rn "형압" src/ | wc -l`) 중 사용자에게 보이는
          것을 '하이라이트'로. 레일 항목 라벨(designRailItems.tsx:709 근방)과 ChipRadio
          aria-label '형압 도구'가 여기 포함된다.
        - >-
          scripts/capture-export.mjs의 emboss 구동부 복구. **지금 깨져 있다** — :276-282가
          "형압 칠하기 시작" 버튼을, :308-316이 "탭해서 종료" 버튼을 찾는데 #679가 그 CTA를
          없애고 도구 칩 탭으로 접었다(EmbossPanel의 ChipRadio.onChange,
          designRailItems.tsx:371-380). `__tests__/embossPanelTapToEnter.test.tsx:36`
          "전폭 CTA 버튼이 없다"가 그 부재를 잠그고 있으므로, `--emboss`는 현재 반드시
          throw한다. d2·d3의 측정 수단이 이것이라 여기서 먼저 고친다.
        - >-
          테스트 6파일의 문자열 갱신(embossPanelTapToEnter · embossPanelContentDiet ·
          embossLasso · designRailSlotBudget · gradientBitmapFramework · designRailDockStability).
      out_of_scope: >-
        렌더 물리 변경 0. 저장물 픽셀이 안 바뀌는 것이 이 하위의 완료 조건이다(ac1).
      depends_on: []
    - id: d2
      title: 새 형압의 시각 물리 — 볼록 압인 굽기
      target: >-
        src/utils/textureRecipes.ts — embossBitmapSvg(:536-590) 옆에 두 번째 굽기 함수와
        레시피 상수를 세우고, 프리뷰(_shared.tsx의 EmbossOverlay, :1340-1380)와
        저장(captureToImage.ts:662-710 compositeEmbossOverlay) 양쪽이 그 한 함수를 공유한다.
      scope:
        - >-
          필터 체인 후보 둘. (A) feDiffuseLighting에 feSpecularLighting을 더해 정반사 하이라이트와
          그림자를 각각 세운다. (B) 블러한 alpha를 feOffset으로 광원 방향 ±로 두 벌 복제해
          밝은 쪽·어두운 쪽을 각각 합성한다. **어느 쪽이 인쇄 하한을 통과하는지는 실측 전엔 모른다**
          (blindspots b1). 외부 선례로 Kinetics(https://kinetics.colorion.co/)의 'Letterpress
          Emboss'가 CSS text-shadow 이중 오프셋으로 같은 물리를 낸다 —
          `calc(var(--lx)*1px) calc(var(--ly)*1px) 1px rgba(255,255,255,.85),
          calc(var(--lx)*-1px) calc(var(--ly)*-1px) 2px rgba(60,40,20,.42)`이고, 부호를 뒤집으면
          deboss↔emboss가 갈린다. 이 레포는 라이브 CSS filter를 못 쓰므로(c2) 같은 물리를
          SVG 필터로 옮기는 것이 이 하위의 일이다.
        - >-
          굽기 캐시·해상도 규율(EMBOSS_BAKE_PX 512, MAX_EMBOSS_CACHE 64, textureRecipes.ts:497-512)은

blindspots:
  - area: 시각 물리 후보 선택
    question: >-
      feSpecularLighting 추가와 blurred alpha 양방향 feOffset 복제 중 어느 쪽이 인쇄 하한(c8)을
      통과하는가? **실측 전엔 모른다 — 추측이다.** 정반사는 좁고 밝은 점을 만들어 alpha 0.08~0.14
      대역에서 뭉개질 수 있고, 양방향 오프셋은 폭을 분율로 잡으면 규칙 6을 구조적으로 만족하지만
      광원 각도가 마스크 곡률과 무관해져 실루엣이 복잡할 때 부자연스러울 수 있다. 두 판을 다
      구워 저장물로 비교하는 게 가장 싼 판정이고, `docs/PRINT_CALIBRATION.md`가 요구하는 건
      화면 판정이 아니라 실물 인쇄 판정이라는 점도 남는다.
  - area: 두 효과 중첩
    question: >-
      blend 'overlay' 레이어가 두 겹 쌓이면 톤이 어떻게 누적되는가? 현행 형압은 재질·코팅 위
      최상단 한 겹이고(_shared.tsx:1183-1189), 두 겹은 이 레포에 선례가 없다. 특히 두 마스크가
      **겹치는 영역**에서 미드톤 압축(c8)이 두 번 걸리면 압축 의도가 무너질 수 있다. 겹침을
      허용할지, 겹치면 어느 쪽이 위인지, 강도 슬라이더를 두 개 둘지가 여기서 갈린다.
  - area: iOS Safari
    question: >-
      새 필터 프리미티브가 iOS Safari 저장물에서 현행과 같게 렌더되는가? macOS Chrome 하네스로는
      원리적으로 못 보는 축이다. 다만 이 리스크는 새로 만드는 게 아니라 물려받는 것이다 — 현행
      형압도 같은 정적 data URL 경로를 이미 타고 있다(#439 큰 raster 함정 회피가 그 경로를 고른
      이유). 실기기 확인은 이 스펙의 완료 조건에서 의도적으로 제외한다.
  - area: 슬롯 예산의 실제 초과폭
    question: >-
      마스크 분리 UI가 슬롯(실효 147px)을 얼마나 더 넘치는가? 편집 중 203px이 #682 다이어트로
      177px(+6px)까지 내려온 상태인데(DesignRail.tsx:105-120), 효과 선택 축 하나와 강도 슬라이더
      하나가 더 붙으면 다이어트 여지가 남아 있는지는 실측 전엔 모른다. 남아 있지 않다면 c5를
      지키는 방법은 "패널을 두 화면으로 접는다" 쪽뿐이고, 그건 d3의 설계 결정이 된다.

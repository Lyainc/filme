      out_of_scope: 마스크 데이터 분리(d3)와 UI(d3). d2는 같은 마스크를 새 물리로 굽는 데까지다.
      depends_on: [d1]
    - id: d3
      title: 마스크 분리 + 두 효과 동시 적용 UI
      target: >-
        src/types/index.ts(:152-159) · src/hooks/usePhototicket.ts(:177-179, :188-192, :295-298) ·
        src/components/v2/designRailItems.tsx EmbossPanel(:349-422) ·
        src/components/v2/EmbossBrushLayer.tsx · 무드 6개의 Poster 호출부.
      scope:
        - >-
          세션 한정 마스크 필드가 3개(embossStamps/embossPaths/embossIntensity)에서 6개로
          늘어난다. 오너가 "마스크 분리"를 명시적으로 골랐고(데이터·UI가 두 벌이 되는 비용을 알고
          고른 것), 두 벌 다 c6의 폐기 계약을 지켜야 한다.
        - >-
          Poster에 넘기는 emboss 프롭이 3개에서 6개로 늘어난다 — MoodMinimal.tsx:192 ·
          MoodCriterion.tsx:275-277 · Mood35mm.tsx:103-105 · Mood35mmLandscape.tsx:109-111 ·
          MoodEditorial.tsx:303 · MoodStub.tsx:214.
        - >-
          패널 안에서 "어느 효과의 마스크를 칠하는가"를 고르는 축이 하나 는다. 슬롯 예산(c5)이
          여기서 제일 세게 걸린다.
      out_of_scope: 브러시·올가미 도구 자체와 좌표계 변경(c3).
      depends_on: [d1, d2]

constraints:
  - id: c1
    type: technical
    description: >-
      새 형압도 저장 경로(captureToImage.ts:662-710 compositeEmbossOverlay)에 같이 실린다.
      프리뷰와 저장이 **같은 굽기 함수**의 산출물을 그린다.
    hard: true
    rationale: >-
      현행 형압이 이미 그 계약 위에 서 있다 — 프리뷰는 embossBitmapSvg의 URL을
      background-image로(_shared.tsx:1358-1377), 저장은 같은 URL을 loadImage → drawImage로
      그린다. 프리뷰만 바꾸면 저장물과 갈리고, 그 어긋남은 사용자가 저장한 뒤에야 발견한다.
  - id: c2
    type: technical
    description: >-
      라이브 CSS/DOM 필터(`filter: url(#x)`)를 쓰지 않는다. 정적 SVG data URL을 new Image()로
      로드해 canvas drawImage로 합성하는 규율(#506 c1)을 그대로 따른다.
    hard: true
    rationale: >-
      html-to-image가 DOM에 걸린 라이브 필터를 캡처해야 하는 방식이 #495 증상의 원인이었고,
      textureRecipes.ts:514-528이 그 근거를 명시해뒀다. noiseTileSvg(feTurbulence) ·
      gradientBitmapSvg · embossBitmapSvg가 이미 이 경로의 소비자 셋이라 새 형압이 네 번째다.
  - id: c3
    type: technical
    description: >-
      칠하는 도구(브러시/올가미)와 좌표계는 그대로 쓴다. 재설계 범위는 디자인(시각 물리)뿐이다.
    hard: true
    rationale: >-
      좌표계는 포스터 **자연 이미지** 0..1 분율이고(textureRecipes.ts:400-415),
      projectEmbossStamps(:429-436)·projectEmbossPaths(:450-454)가 렌더 시점의 fit/align으로
      박스 분율에 투영한다. 이 재매핑 덕에 무드·posterFit 전환에도 마스크가 안 흔들린다 —
      오너 결정 5가 도구·좌표계를 범위 밖으로 둔 이유고, 여기 손대면 그 불변식을 다시 세워야 한다.
  - id: c4
    type: technical
    description: >-
      새 형압의 필터 체인은 마스크 경계의 서로 반대편에 밝은 면과 어두운 면을 **동시에** 세운다.
      feDiffuseLighting 단독으로는 이 명제가 원리적으로 성립하지 않으므로 그 체인을 그대로
      복제하는 방식은 채택하지 않는다.
    hard: true
    rationale: >-
      확산 반사는 광원 반대편을 어둡게 만드는 게 아니라 덜 밝게 만들 뿐이다. 이 성질이 현행
      효과를 "광택"으로 만든 원인이고, 곧 이 에픽이 존재하는 이유다(goal.rationale). 오너 결정
      4의 시각 목표는 볼록하게 튀어나온 압인이며 눌린 자국(deboss)이 아니다.
  - id: c5
    type: technical
    description: >-
      레일 슬롯 높이 클래스 `h-[min(214px,26svh)]`(DesignRail.tsx:124)는 바꾸지 않는다.
      UI가 두 벌이 되면서 넘치는 분량은 이미 있는 CSS 스크롤 어포던스로 감수하거나, 패널
      콘텐츠를 조건부로 접어(#682 다이어트 방식) 해결한다.
    hard: true
    rationale: >-
      슬롯 클래스를 바꾸면 `scripts/measure-chrome.mjs`의 BASELINE_SLOT_HEIGHT_CLASS와 문자로
      어긋나 `__tests__/measureChromeBaselineCoupling.test.ts`가 깨지고, 하네스 BASELINE
      (dock 290 / 프리뷰 190.9×305)을 전부 다시 재야 한다. 그 결합은 #682가 슬롯만 바꾸고
      불변식을 안 고쳐 main이 건강한데도 두 주 넘게 exit 1이 나던 사고에서 나왔다. 형압 패널은
      편집 중 203px로 이미 슬롯(393×659에서 171px, py-3 빼면 실효 147px)을 넘고 있어
      (#682 실측, DesignRail.tsx:105-120 주석), 마스크 분리가 이 압박을 더 키운다.
  - id: c6
    type: technical
    description: >-
      두 마스크 모두 포스터 교체·재크롭 시 함께 폐기한다. usePhototicket.ts:295-298의 폐기가
      6필드 전부를 덮어야 한다.
    hard: true
    rationale: >-
      그 콜백이 포스터 교체·재크롭 양쪽의 단일 진입점이라(usePosterCrop → onCropComplete가
      재크롭도 여기로 보낸다), 마스크가 옛 포스터 픽셀을 가리키는 채 새 포스터에 얹히는 orphan을
      한 곳에서 막는다. 새 필드 3개 중 하나라도 빠지면 그 축만 orphan이 살아남는데, 두 효과가
      겹쳐 뜨는 화면에서는 어느 쪽이 남았는지 눈으로 가리기가 더 어렵다.
  - id: c7
    type: technical
    description: >-
      레일 항목 id를 'emboss'에서 'highlight'로 바꾸고, 그 id를 읽는 세 자리를 같이 고친다 —
      DesignRail.tsx:245의 `pop !== null && pop !== 'emboss'` 조건(#722, 방금 머지 대기 중),
      scripts/capture-export.mjs:262의 `[data-rail-id="emboss"]` 셀렉터, 그리고 항목 정의
      designRailItems.tsx:709.
    hard: false
    rationale: >-
      안 바꾸면 'emboss'가 두 뜻을 갖는다 — 상위 메뉴는 하이라이트인데 하위 효과 하나도 형압이라,
      코드에서 `pop === 'emboss'`가 어느 쪽을 가리키는지 읽는 사람마다 갈린다. 대가는 세 자리와
      그걸 기대하는 테스트뿐이라 지금이 제일 싸다. #722의 effect는 셋 중 유일하게 조용히 깨지는
      자리다(id가 안 맞으면 조건이 항상 참이 돼 형압 편집 모드가 자기 패널에서도 꺼진다).
  - id: c8
    type: technical
    description: >-
      새 형압의 톤은 `docs/PRINT_CALIBRATION.md` "배경 도상 설계 하한"의 규칙 3·4·6을 통과해야
      한다 — alpha 0.08~0.14 대역, 계조는 밀도로만, 그리고 절대 치수를 굽기 좌표계에 상수로 박지
      않고 배치 폭에서 역산한다.
    hard: false
    rationale: >-
      규칙 3의 근거가 "톤 램프 양 끝 5%가 인쇄에서 붕괴한다(0/1/3% 구분 불가)"이고, 현행
      EMBOSS_RECIPE의 midSlope 0.35 / midIntercept 0.35(textureRecipes.ts:487-488)가 정확히
      그 붕괴를 피하려고 출력을 gray 0.35~0.7로 압축한 값이다(:456-460 주석, #591 인쇄 실측).
      새 형압은 어두운 면을 **새로** 만드는 것이라 하한의 아래쪽 끝에 처음 닿는다 — 순흑에
      가까운 그림자는 인쇄에서 뭉개진다. 규칙 6("viewBox에 절대 치수를 박지 말라")은 이미
      bevelFrac(폭 분율, :484)이 지키고 있는 형태라, 새 오프셋 폭도 px 상수가 아니라 분율로
      둬야 같은 성질이 유지된다.
  - id: c9
    type: technical
    description: >-
      두 마스크 모두 세션 한정으로 남긴다. IndexedDB·draft·undo 스냅샷에 싣지 않는다.
    hard: false
    rationale: >-
      types/index.ts:140-152가 #489 재검토를 거쳐 내린 결정을 적어뒀다 — 마스크는 분율 좌표라
      새로고침 후 fit·align·크롭 파이프라인이 조금이라도 다른 순서로 정착하면 같은 분율이 다른
      픽셀을 가리킨다. 픽셀이 조용히 어긋난 채 복원되는 것보다 사라지는 쪽이 안전하다는 판단이고,
      마스크가 두 벌이 되면 어긋남이 두 겹으로 겹쳐 판독이 더 어려워지므로 근거가 강해진다.
  - id: c10
    type: technical
    description: >-
      새 형압도 6무드 전부에 적용한다. minimal 한정 같은 무드 게이팅을 새로 만들지 않는다.
    hard: false
    rationale: >-
      현행 형압이 이미 6무드 전부에 실려 있고(무드별 Poster 호출부 6곳), 마스크가 포스터 자연
      이미지 좌표라 무드 캔버스 비율과 독립이다(c3). 갈릴 이유가 없는 값에 무드별 단일 소스를
      만드는 건 죽은 추상이다(#680 c8과 같은 판단).

success_criteria:
  - id: ac1
    description: >-
      개명(d1) 후 저장물 픽셀이 안 바뀐다. 사용자 노출 문구에는 옛 의미의 '형압'이 남지 않는다.
    verifiable: true
    measurable_via: >-
      `bun scripts/capture-export.mjs --emboss --out /tmp/before.jpg`를 개명 전 트리에서,
      같은 명령을 개명 후 트리에서 돌려 `--compare /tmp/before.jpg /tmp/after.jpg`.
      하네스 잡음 바닥이 같은 트리 2회 캡처 기준 maxΔ 2라 허용치 3(기본값과 동일). 단
      **개명 전 캡처를 먼저 떠야 한다** — d1이 하네스 자체를 고치는 하위라, 복구 커밋 이전
      트리에서는 `--emboss`가 :282에서 throw한다. 문구 쪽은 테스트 6파일의 문자열 단언이 잠근다.
  - id: ac2
    description: >-
      새 형압 단독 적용 시 마스크 경계의 서로 반대편에 밝은 픽셀과 어두운 픽셀이 동시에 선다(c4).
    verifiable: true
    measurable_via: >-
      두 갈래로 나눠 잰다. ① 부호 판정은 유닛이 맡는다 — gradientBitmapFramework.test.tsx의
      "#509 c1 형압 비트맵 굽기" describe와 같은 형태로, 굽힌 SVG 문자열에 밝은 성분과 어두운
      성분이 둘 다 들어갔는지(feSpecularLighting 노드, 또는 feOffset dx/dy가 부호 반대인 쌍)를
      단언한다. ② 저장물 쪽은 `--compare`로는 부호를 못 가른다 — 스크립트가 내는 건 **채널 최대

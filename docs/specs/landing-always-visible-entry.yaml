blindspots:
  - area: 자동저장 OFF 사용자
    question: >-
      자동저장을 끈 사용자(`AUTOSAVE_PREF_KEY`, #436)에게는 c7의 "덮이는 시점"이 영영 안 온다.
      새로 시작해도 옛 draft가 저장분에 그대로 남아 다음 방문에도 "이어서 만들기"가 뜬다. 이게
      의도인지(= 저장을 끈 사람의 저장분은 사용자만 지운다) 아니면 진입 커밋에서 지워야 하는지
      확정 안 됨. 이 스펙은 **의도로 본다** — 자동저장 OFF는 "내가 명시적으로 저장할 때만 써라"는
      선언이고, 그 상태에서 앱이 몰래 지우는 게 더 놀랍다. 확신도는 중간이다.
  - area: 여러 탭
    question: >-
      탭 두 개를 열어 한쪽에서 새 문서를 저장하면 다른 탭의 "이어서 만들기"가 이미 사라진 문서를
      가리킨다(라벨의 제목도 stale). 현행에도 있는 문제지만 이 스펙이 복원 진입점을 1급으로
      올려 노출을 키운다. `storage` 이벤트로 라벨을 갱신하는 건 이 스펙 범위 밖으로 둔다 —
      실사용에서 관측된 적이 없고, 눌러도 지금 메모리의 문서로 들어갈 뿐이라 데이터 유실은 없다.
      (추측: 유실 없음. 다중 탭 실측은 안 했다.)
  - area: draft TTL
    question: >-
      draft에 TTL이 없어 석 달 전 작업도 1급 진입점으로 올라온다. 제목을 라벨에 싣는 것(c6)이
      유일한 완화이고, "언제 만든 것인가"는 안 보인다. `PersistedState`에 저장 시각이 없어서
      날짜를 붙이려면 스키마를 늘려야 하는데(`saveDraft`, `usePhototicket.ts:655-677`), 옛
      저장분엔 그 필드가 없어 첫 방문에선 어차피 못 보여준다. 이번 범위 밖으로 두고, 사용자가
      "이게 뭐였지"로 헤매는 게 실제로 관측되면 그때 연다.
  - area: 첫 페인트 자리 예약의 실기기 검증
    question: >-
      c9의 근거인 299ms는 #675의 실측이지만, 뒤집은 규칙(행을 드러내는 쪽)이 실기기 첫 페인트에서
      정말 자리 이동 0을 내는지는 `measure-chrome.mjs`로 못 잰다 — 하네스는 안정화된 뒤의 rect를
      재지 페인트 타임라인을 안 본다. 회귀가 나면 "재방문 첫 화면에서 CTA가 한 번 밀린다"는
      형태로만 보일 것이다. 이 축은 육안 확인으로 남긴다.
  - area: 랜딩 뒤에 살아 있는 문서
    question: >-
      c7이 마운트 복원을 그대로 두므로, 사용자가 랜딩을 보는 동안 셸에는 이미 복원된 문서가
      떠 있다(보이진 않는다). 그 상태에서 `update*`를 부르는 경로가 랜딩 위에 하나라도 있으면
      자동저장이 돌아 c7의 "덮이는 시점"이 흐려진다. 무드 갤러리 탭이 유일한 후보였고 #615가
      동일값 가드를 이미 걸어뒀지만(`MobileEditorShell.tsx:1047-1062`), 그 가드의 의미는 이
      스펙에서 뒤집힌다 — 이제 무드 탭은 "새 문서를 이 무드로 시작"이라 항상 커밋이다. 가드를
      지울지 남길지 구현 시 판정할 것. (전수 확인은 안 했다 — 랜딩 위 컨트롤이 `update*`를
      부르는 다른 자리가 없다는 건 추측이다.)


# Seed Spec — 랜딩 상시 노출 + draft 복원을 1급 진입점으로 (#612 계열)
---
skill: build-spec
schema_version: 1
version: 4.7.0
generated: 2026-08-18
input:
  target: 랜딩 상시 노출과 draft 복원 진입점
  options: []
output:
  type: spec
  structure: templates/SEED_SPEC.yaml

spec_version: 1
created: 2026-08-18
target: 랜딩 상시 노출과 draft 복원 진입점
domain: tech
brownfield: true
refine_generation: 0

goal:
  statement: >-
    재방문자에게도 랜딩을 항상 보여주고, 이전 draft를 이어받는 길을 랜딩의 1급 진입점(주 CTA 위
    별도 층)으로 세운다. "draft가 있으면 랜딩을 생략한다"는 #675 D7 정책을 뒤집어, 재방문자가
    무드 갤러리·OCR·포스터 업로드·직접 입력이라는 네 진입 경로와 "이어서 만들기"를 같은 화면에서
    고를 수 있게 한다.
  clarity_score: 0.9

constraints:
  - id: c1
    type: product
    description: >-
      랜딩은 draft 유무와 무관하게 항상 뜬다. 지금의 생략 조건 두 개를 걷어낸다 —
      `MobileEditorShell.tsx:473-474`의 `showLanding`에서 `!photo.draftRestored`가 빠지고,
      `:1041`의 `mode={canvasReady || isMax ? 'hidden' : ...}`에서 `canvasReady`도 빠진다.
    hard: true
    rationale: >-
      `draftRestored`만 빼는 건 부족하다. `canvasReady = !!croppedImageUrl || landingDismissed ||
      photo.awaitingPosterRestore`(`:318`)라서, 포스터가 있던 draft를 복원하면 IndexedDB에서
      포스터가 도착하는 순간 `croppedImageUrl`이 서고 랜딩이 다시 숨는다. 즉 제일 흔한 재방문자
      (포스터 있는 draft)에겐 정책이 뒤집히지 않은 채로 남는다. 랜딩 표시는 파생값이 아니라
      **사용자가 랜딩을 떠났는가** 하나로 판정해야 한다.
  - id: c2
    type: technical
    description: >-
      랜딩 표시 판정을 단일 이탈 state로 바꾼다. `landingDismissed`(`:299`)가 그 state이고,
      다섯 경로가 전부 이걸 세운다 — OCR 적용(`:1074`), 포스터 크롭 확정(`usePosterCrop.ts:97`
      → `handleImageUpload`), 직접 입력(`:1043`), 무드 갤러리 탭(`:1047`), 그리고 새로 만들
      "이어서 만들기". 판정식은 `mode = isMax || landingDismissed ? 'hidden' : 'overlay'`가 된다.
    hard: true
    rationale: >-
      `croppedImageUrl`을 판정에 섞으면 "사용자가 방금 크롭했다"와 "복원이 포스터를 늦게
      가져왔다"를 구분하지 못한다. 두 경로는 실제로 갈려 있다 — 크롭 확정은
      `handleImageUpload`를 타고, IDB 복원은 `usePhototicket.ts:411` 근처에서 `setState`로 직접
      주입한다. 이탈을 state로 명시하면 그 구분이 공짜로 생긴다.
  - id: c3
    type: technical
    description: >-
      inline 모드를 삭제한다. `Landing`의 `mode`는 `'overlay' | 'hidden'` 두 값이 되고,
      `Landing.tsx:455`의 `overlay` 분기와 `:427` 타입, 셸 `:1041`이 함께 바뀐다.
    hard: true
    rationale: >-
      c2를 적용하면 inline이 **코드상 도달 불가능**해진다. 현행 `:1041`에서 inline은
      `!canvasReady && !isMax && !showLanding`인데, `!showLanding`은 곧 `landingDismissed`이고
      `canvasReady`(`:318`)가 `landingDismissed`를 항으로 갖고 있으므로 `landingDismissed ⇒
      canvasReady ⇒ 'hidden'`이다. 남은 진입로였던 `crop.cropOpen`도 c4로 사라진다. 실제 화면
      근거도 같은 방향이다 — inline은 헤드카피·히어로 캐러셀·배경 타일·AppFooter를 전부 안 그려
      (`Landing.tsx:480·484·529·591`이 모두 `overlay &&`), 실측(390×844 모바일 에뮬레이션)에서
      헤더 아래 큰 빈 공간 + 가운데 CTA 하나만 남아 "랜딩이 안 뜬 것"처럼 보였다. inline이
      지키던 두 명제(텍스트만 있던 draft 복원의 진입 표면, IDB 포스터 복원 실패 시 #489 결정 5의
      재업로드 유도)는 이제 오버레이 랜딩 자신이 더 낫게 받는다.
  - id: c4
    type: technical
    description: >-
      `showLanding`의 `!crop.cropOpen` 항도 걷는다. 크롭 모달이 열려 있는 동안 랜딩은 오버레이인
      채로 모달 뒤에 남고, 크롭 취소면 그대로 랜딩이다.
    hard: false
    rationale: >-
      크롭 모달은 `ImageCropModal.tsx:210`에서 `fixed inset-0 z-50`이고 셸 트리에서 랜딩(`:1030`)
      보다 뒤(`:1280`)에 서므로, z가 같아도 DOM 순서로 모달이 위에 그려진다. 즉 랜딩을 걷지 않아도
      가려진다. 이 항이 하던 일(취소 시 빈 셸 방지)은 이탈 state가 안 서 있으므로 저절로 성립한다.
      이 항을 남기면 inline이 그 상태 하나로 살아남아 c3가 무효가 된다.
  - id: c5
    type: product
    description: >-
      복원 제안은 모달이 아니라 랜딩 본문의 진입점이다. 주 CTA(`Landing.tsx:548`의 children =
      `OcrUploadCard`) **위** 별도 층에 놓고, 편집 진입 시점의 확인 모달은 만들지 않는다.
    hard: true
    rationale: >-
      랜딩 진입 경로가 4종(OCR·포스터 업로드·직접 입력·무드 갤러리 클릭)이라 어느 걸 눌러도
      무관한 질문이 끼어든다. 그리고 "이전에 작업한 게 있으니 불러올까요?"는 조건절 + 의문
      종결어미라 `docs/COPY_TONE_GUIDE.md` 축 2 위반이다(축 1의 질문형 예외는 비가역 동작 확인
      한 자리 — `confirmWordmarkReset` — 뿐이고, 그 희소성이 경고를 경고로 만든다).
      오너 원안(편집 진입 시 모달)은 expert-panel 만장일치로 기각됐다.
  - id: c6
    type: product
    description: >-
      라벨은 조건절 없는 명령형이다. 기본형 "이어서 만들기", 제목이 있으면
      `이어서 만들기 — <제목>`. 제목은 한 줄 말줄임으로 자른다.
    hard: true
    rationale: >-
      `COPY_TONE_GUIDE.md` 축 2 금지 3종(조건절·종결어미·마침표) 어디에도 안 걸리고, `-하기`는
      금지가 아니다(`꽉 채우기`·`처음 화면으로 돌아가기` 선례). 부연을 잇는 부호는 ` — `로
      통일하고 양쪽이 명사구여야 한다는 표기 규칙도 만족한다(동명사 + 고유명사). 제목을 싣는 건
      무엇을 이어받는지 보이게 하기 위해서다 — draft에 TTL이 없어 석 달 전 작업도 그대로 남으므로,
      라벨의 제목이 "지금 이게 뭔지"를 말하는 유일한 장치다.
  - id: c7
    type: technical
    description: >-
      "새로 시작"에 해당하는 네 진입 경로는 이전 draft를 **즉시 파기하지 않는다.** 진입 커밋
      시점에 하는 일은 메모리 문서를 새 문서로 되돌리는 것뿐이고(`INITIAL_STATE` + 복원 ref·크롭
      원본·히스토리 리셋), `localStorage`/IndexedDB의 저장분은 건드리지 않는다. 저장분이 실제로
      덮이는 시점은 **새 문서의 첫 자동저장**이다.
    hard: true
    rationale: >-
      `clearDraft`(`usePhototicket.ts:809`)는 `localStorage.removeItem` + `clearImages()`까지
      하는 비가역 절차라 진입 탭 한 번에 걸면 석 달 전 draft가 되돌릴 수 없이 사라진다. 특히
      무드 갤러리는 화면 가운데를 덮는 자동 회전 캐러셀이라 오탭 확률이 낮지 않다. 저장분을
      안 지우면 새로고침 한 번으로 "이어서 만들기"가 다시 뜨므로 오탭이 복구 가능해진다.
      덮이는 시점이 모호하지 않은 근거는 `:769`의 `if (dirtyTick === 0) return;` — 자동저장은
      실사용자 편집(`update*` 3종)이 한 번이라도 있어야 예약되고, 복원·리셋은 `dirtyTick`을
      안 올린다. 즉 랜딩에 머무는 동안은 원리적으로 아무것도 안 써진다. 첫 자동저장이 이미지까지
      덮는 것도 확인된다 — `saveImages`는 스토어를 통째로 비우고 다시 채우고(`imageDb.ts:29-31`),
      리셋 직후 지문은 전부 null이라 `lastPersistedImageFingerprintRef`(초기값 `''`)와 달라
      스킵되지 않는다.
      **파생 요구**: `clearDraft`를 "문서 리셋"과 "저장분 삭제" 두 조각으로 갈라 앞쪽만 쓰는 게
      제일 작은 diff다. 워드마크 탭 초기화(`performClear`, `:492`)는 지금처럼 둘 다 쓴다.
  - id: c8
    type: technical
    description: >-
      진행 중인 IndexedDB 복원이 새 문서에 끼어들면 안 된다. `usePhototicket.ts:384`의 IDB
      effect는 마운트에서 무조건 돌고 `.then` 안에서 `setState`로 이미지 5종을 주입하는데,
      그 사이 사용자가 "새로 시작" 경로로 진입하면 옛 포스터가 새 문서에 들어온다. 문서 세대
      (epoch) ref를 하나 두고 주입 직전에 대조해 버린다.
    hard: true
    rationale: >-
      기존 `cancelled` 플래그는 언마운트/StrictMode 이중 마운트만 막지 문서 교체를 모른다.
      같은 처방의 선례가 이미 이 레포에 있다 — OCR 보강의 최신성 판정을 인스턴스 로컬
      `mountedRef`에서 셸 소유 `ocrEpochRef` epoch 비교로 옮긴 #388 / PR #413 P0(커밋 007f381).
      c7이 저장분을 살려두기 때문에 이 창이 실제로 열린다(저장분을 즉시 지우는 설계였다면
      `clearImages()`가 경합으로 덮었을 자리다).
  - id: c9
    type: technical
    description: >-
      `_document.tsx:22`의 `has-draft` 스탬프는 남기되 의미를 뒤집는다 — "랜딩 오버레이를
      숨긴다"가 아니라 "복원 진입점을 첫 페인트에 드러낸다". `globals.css:396`의
      `html.has-draft [data-testid='landing'].fixed { display: none; }`은 **삭제**하고, 그 자리에
      복원 행을 기본 숨김 → `html.has-draft`에서 노출로 바꾸는 규칙이 들어간다. 같은 스크립트의
      테마 FOUC 축(`:15-21`)은 손대지 않는다. 새 규칙의 소비처가 없다고 판정되면 스탬프 한 줄까지
      함께 지운다.
    hard: true
    rationale: >-
      복원 행의 표시 근거인 `draftRestored`는 SSR 하이드레이션 불일치를 피하려 effect로 미룬
      복원에서 서고, #675가 그 지연을 **299ms로 실측**했다. 그 사이 행이 없다가 뒤늦게 끼어들면
      주 CTA가 아래로 밀리는데, 299ms는 사용자가 이미 탭할 수 있는 시간이라 오탭이 난다. 서버
      HTML에 행을 담아두고 blocking 스크립트가 찍는 클래스로 드러내면 자리 이동이 0이다 —
      #675가 만든 장치를 방향만 바꿔 그대로 쓰는 것이고, 손상된 저장분에서 게이트를 거두는 경로
      (`clearDraftPaintGate`, `usePhototicket.ts:48`)도 그대로 유효하다(행이 다시 숨는다).
      반대로 오버레이 숨김 규칙은 이 스펙이 뒤집는 명제 자체라 남기면 죽은 코드가 아니라
      **정면 충돌**이다.
  - id: c10
    type: process
    description: >-
      #717을 먼저 닫지 않는다. 이 작업이 대상 테스트 2개를 흡수한다 —
      `__tests__/landingOverlay.test.tsx`의 "드래프가 복원되면 오버레이를 생략하되 진입 컨트롤은
      본문에 남는다 (D7)"는 뒤집힌 명제로 재작성되고,
      `__tests__/awaitingPosterRestore.test.tsx`의 "IndexedDB 복원이 실패하면 대기가 풀려 기존
      재업로드 유도 inline이 돌아온다"는 inline 소멸(c3)에 맞춰 재작성된다. 남은 1개
      (landingOverlay의 "이탈 경로 포스터 업로드 … 오버레이가 걷힌다")와 **진짜 원인 조사**는
      #717에 남긴다. 착수 시 #717에 코멘트 + 백링크를 남긴다.
    hard: true
    rationale: >-
      #717이 다루는 건 부하 상태 전 스위트에서 이 3개가 AssertionError로 깨지는 현상이고, 본문이
      "두 파일만 단독으로 돌리면 재현 안 됨 → 전체 실행에서의 순서·전역 상태 결합"을 이미 가리킨다
      (CLAUDE.md 🧪의 #611 부류). **테스트를 다시 쓰는 것은 그 원인을 안 고친다** — 재작성된
      테스트도 같은 전역 누수에 같은 방식으로 걸릴 수 있다. 반대로 #717을 먼저 닫으려면 지금
      곧 사라질 단언을 붙들고 순서 의존을 파야 한다. 그래서 흡수는 "테스트 2개의 소유권"까지고,
      원인 축은 #717이 계속 소유한다.
  - id: c11
    type: product
    description: >-
      복원 행이 랜딩의 세로 예산을 넘기면 안 된다. 400×675 프레임에서 복원 행 · 주 CTA · 이탈
      경로 2종이 스크롤 없이 다 보여야 한다. 실측 결과 넘치면 재방문 상태(has-draft)에 한해
      서브카피 한 줄을 먼저 접는다 — 헤드카피와 히어로 캐러셀은 유지한다.
    hard: false
    rationale: >-
      랜딩 세로 예산은 #615에서 이미 빠듯하게 잡혔고(카피 크기를 낮춰 갤러리에 예산을 넘긴 이력),
      오버레이는 `overflow-y-auto`라 넘쳐도 조용히 스크롤로 흡수돼 "주 CTA가 접힌 아래로 내려간"
      상태가 티가 안 난다. 서브카피를 먼저 접는 건 축 5(브랜드 카피)에서 헤드 2줄 중 아래
      한 줄이 값어치가 낮고, 재방문자는 이미 서비스를 아는 사람이라서다.
  - id: c12
    type: technical
    description: >-
      복원 행은 `min-h-touch`(44px) 탭 타깃을 갖는다.
    hard: true
    rationale: >-
      같은 랜딩의 이탈 경로 2종이 WCAG 2.5.8(AA) 24×24 미달을 같은 처방으로 채웠다
      (`Landing.tsx:576·581`, #646). 새 컨트롤만 예외를 두면 그 결정이 조용히 깨진다.

success_criteria:
  - id: ac1
    description: >-
      draft가 있어도 랜딩이 오버레이로 뜬다. 텍스트만 있던 draft와 포스터가 있던 draft 둘 다.
    verifiable: true
    measurable_via: >-
      `__tests__/landingOverlay.test.tsx`의 D7 케이스를 뒤집어 재작성 — `localStorage.setItem(
      STORAGE_KEY, ...)` 뒤 render하고 `landing().classList.contains('fixed') === true`.
      포스터 축은 `__tests__/awaitingPosterRestore.test.tsx`의 imageDb 스텁(`loadGate`)을 그대로
      써서 IDB 복원이 **끝난 뒤에도** `.fixed`가 유지되는지 확인한다 — c1이 지목한 `canvasReady`
      항이 살아 있으면 정확히 여기서 깨진다.
  - id: ac2
    description: >-
      복원 진입점이 주 CTA 위에 있고, 라벨이 조건절·종결어미·마침표 없는 명령형이며 제목을 싣는다.
    verifiable: true
    measurable_via: >-
      같은 파일 새 케이스 — `screen.getByTestId('landing-restore')`의 textContent가

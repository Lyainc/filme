goal:
  statement: >-
    랜딩을 "무드를 고르고 티켓 스크린샷 한 장으로 채우는" 진입 단계로 바꿔, 극장 관람 기록을
    굿즈로 남기는 경로가 첫 화면에서 시작되게 한다. 서비스 명제는 "당신의 영화관람을 당신만의
    굿즈로 남기세요"이고, 그에 맞춰 타겟을 극장에서 영화를 본 사람으로 좁힌다.
  clarity_score: 0.9

# 1차 = 아래 전부. 2차(OCR 제목 → TMDB 포스터 자동 검색 체인, #537)는 #665로 폐기 — 머리말 참고.

#   TMDB API 약관이 AI 애플리케이션에서의 사용을 금지하는데 그 체인이 정확히 금지 대상이라,
#   #537 구현분(모달·프록시 3종·rate limit 스코프)까지 통째로 철거했다(docs/NATIVE_IOS_RFC.md
#   §7.1·§9). 아래 본문의 TMDB 서술은 전부 2026-08-02 시점의 기록이고, 1차(#631·#615·#635)는
#   그대로 유효하다. 자동 포스터 보강을 다시 하려면 TMDB가 아닌 소스로 처음부터 설계할 것.

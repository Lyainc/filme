  first:
    - "#631 빈 포스터 슬롯 렌더 (선행)"
    - "#615 히어로 캐러셀을 전시 → 선택으로 재설계"
    - "#635 OCR을 랜딩 주 CTA로 승격 + 이탈 경로 3종 (스크린샷 없음 / OCR 실패 / rate limit 초과)"
  second:
    # 폐기(#665, 2026-08-10) — 파일 머리말 참고. TMDB로는 못 하고, 대체 소스는 미정.
    - "OCR 제목 → TMDB 포스터 자동 검색 체인 (#537) — 폐기"

constraints:
  - id: c1
    type: technical
    description: >-
      #631(포스터 없는 티켓 렌더)이 선행 완료돼야 한다. `_shared.tsx`가 `src`
      falsy일 때 `data-poster-root`를 빼고 `<img>`를 아예 안 그리는 분기까지 포함한다.
    hard: true
    rationale: >-
      빈 포스터 슬롯이 렌더돼야 (1) OCR 후킹이 벌어질 무대가 서고 (2) 랜딩 예시를
      저작권 없는 형태로 만들 수 있다. (해소됨, 2026-08-02) 착수 전엔
      `TicketRenderer.tsx:20`·`_shared.tsx:12`가 `croppedImageUrl: string` 논널
      계약이라 포스터 없는 렌더 경로가 타입 수준에서 존재하지 않았고,
      `captureToImage.ts:78`이 깨진 이미지에 throw해 저장·공유도 같이 죽었다 —
      #631 D3(PR #632)로 둘 다 `string | null`로 열려 지금은 정상 렌더된다.

  - id: c2
    type: technical
    description: >-
      OCR의 shared rate-limit 윈도우가 소진되면 첫 화면이 죽지 않고 수동 입력으로
      하강해야 한다. OCR 실패·인식 오류도 같은 자리에서 손으로 이어진다.
    hard: true
    rationale: >-
      OCR rate limit은 per-IP 위에 키 전체 shared 윈도우가 한 겹 더 있다
      (`src/utils/ratelimit.ts`, `.claude/skills/ocr-pipeline/SKILL.md`). 첫 액션이
      OCR이면 유입 스파이크가 그대로 OCR 스파이크라, 공유로 한번 터지는 순간 신규 유입
      전원이 첫 화면에서 막힌다 — 제일 잘 되는 날에 제일 크게 망가지는 모양이다.
      첫 액션은 회복 경로가 없으면 그대로 이탈이다.

  - id: c3
    type: legal
    description: >-
      랜딩 예시 자산은 AI 생성이고 세로+가로 2방향이다. #613의 "지금 에디터로 수동
      제작"을 대체한다.
    hard: true
    rationale: >-
      #231이 저작권 때문에 극장·포맷 로고를 번들에서 전부 걷어낸 전례가 있고
      (CLAUDE.md asset manifest), 영화 포스터는 로고보다 명백한 저작물인데 랜딩은
      첫 진입자 전원이 받는 상시 노출 화면이다. 2방향인 이유는 별개다 — 무드 6종 중
      `stub`·`35mm-landscape`가 `posterOrientation: 'landscape'`라
      (`src/utils/layouts.ts`) 세로 한 장으로 채우면 그 두 슬라이드만 잘려 보이고,
      무드 비교가 목적인 화면에서 그건 "이 무드는 이상하다"로 읽힌다.
      #612 D4("한 작품 × 6무드")는 같은 작품의 세로판·가로판이므로 그대로 지켜진다.

  - id: c4
    type: technical
    description: 400×675에서 스크롤 없이 한 화면.
    hard: true
    rationale: >-
      #563 불변식이 걸린 프레임 규격이고, #615가 이미 673/675로 아슬아슬하다.
      선택 UI와 이탈 경로가 붙으면 확실히 넘친다.

  - id: c5
    type: other
    description: >-
      예산이 넘치면 카피부터 줄인다 — 헤드 2줄+서브 2줄 → 각 1줄, ~56px 회수.
      배경 타일 그리드와 무드 칩 스트립은 깎지 않는다.
    hard: false
    rationale: >-
      #612가 고치려던 건 "가치 제안 문장이 화면에 0개"지 문장이 짧다는 게 아니라,
      1줄+1줄도 0개보다 훨씬 낫다. 그리고 캐러셀이 선택 가능해지면 "그래서 뭘 얻나"를
      카피 대신 인터랙션이 답하므로 카피 의존도가 실제로 낮아진다 — 선택 가능한 전경은
      #612 D2가 말하는 "증거"를 문장보다 세게 전달한다.

  - id: c6
    type: other
    description: >-
      이탈 경로("포스터부터 올리기 · 직접 입력")는 주 CTA 바로 아래 한 줄 —
      지금 OCR이 있던 자리에 위계만 뒤집는다.
    hard: false
    rationale: >-
      새 세로 공간 0으로 c4를 지키면서, 스크린샷 없는 사람이 첫 화면에서 자기 자리를
      잃지 않는다. `OcrUploadCard.tsx:250-253`이 의도적으로 위계를 낮춰둔 배치를
      그대로 뒤집어 쓰므로 새 구조가 필요 없다.

  - id: c7
    type: technical
    description: 실물 티켓 사진(스크린샷 아닌) 인식은 이미 동작하므로 OCR 프롬프트를 건드리지 않는다.
    hard: false
    rationale: >-
      오너 확인(2026-08-02) — 현재 파이프라인이 이미 커버한다. OCR 규칙은 실측
      기반이라 근거 없이 손대지 않는다(`.claude/skills/ocr-pipeline/SKILL.md`).


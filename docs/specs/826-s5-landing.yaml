    description: "잠긴 랜딩 문구 유지: '포스터 업로드' · '포스터 없이 직접 입력'(링크 쌍, data-testid landing-skip-poster 유지), '티켓 스크린샷으로 자동입력'(주 CTA · 파일 input aria-label), 헤드라인 '티켓 한 장이, 내 굿즈가 돼요' · 서브 '스크린샷으로 자동입력. 사진으로 찍은 실물 티켓도 돼요.', 고지 문구는 글자 그대로다. COPY_TONE_GUIDE 잠금 표 첫 행의 테스트 9개(landingOverlay · landingHeroMood · a11yFieldTapAndTapTargets · mobileChromeOrder · posterCropPipeline · resultStageWordmarkReset · mobileEditorShellOcrEntryConsolidation · logoCropFreeAspect · mobileChromeDarkHtmlBg)를 포함해 이 문구를 쓰는 테스트의 그 문자열은 고치지 않는다."
    hard: true
    rationale: "07-seeds S5 '잠긴 랜딩 문구 유지(테스트 9개)', 50-copy-locked 3 · 4행, trace l_poster · l_noposter · l_copy(유지), CLAUDE.md 🚧 '일부러 남긴 것'."
  - id: constraint-13
    type: technical
    description: "문서 갱신: docs/COPY_TONE_GUIDE.md '테스트가 잠근 문구' 표를 실제 grep에 맞춘다 — 바뀐 OCR 문구 행(ocrFailureFlow의 '인식에 실패했어요'), 새 라벨 '이용 고지' · '제목 없는 티켓' · 무드 이름이 테스트에 잠기면 그 행, 첫 행 목록이 실제와 다르면(착수 시점 resultStageWordmarkReset에는 두 문구가 없다) 실제 파일 목록으로 고친다. 바뀐 요구 1(정지 수단 = 누르는 동안 · 포커스 동안 정지 + 동작 줄이기 격자, 2026-11-17 소유자 결정)을 #826 코멘트로 남긴다. 랜딩 컴포넌트 주석의 옛 정지 버튼 · 늦추기 설명과 상수(CAROUSEL_SLOW_INTERVAL_MS · 3500 간격)를 지운다."
    hard: true
    rationale: "COPY_TONE_GUIDE '문구를 바꾸면 같은 커밋에서 테스트를 함께', 03-open '요구 1(#778) 문구를 #826에서 고쳐야 해요 — #826 코멘트', 07-seeds S5 '바뀐 요구 1'."
  - id: constraint-14
    type: technical
    description: "하네스 불변식: prod 빌드에 bun scripts/measure-chrome.mjs --theme dark · --theme light가 exit 0이고 dock 249 / 프리뷰 219×350, 랜딩 · posterless · 프레임 봉쇄 축이 통과한다. 랜딩 셀렉터가 바뀌어 축이 깨지면 그 축을 새 구조로 고치되 checked:false로 남기지 않고, 새 축을 넣으면 process.exitCode에 싣는다."
    hard: true
    rationale: "CLAUDE.md 📏(#609 · #714 · #727 · #674), docs/HARNESS.md 4 · 10 · 11절."
  - id: constraint-15
    type: technical
    description: "검증 경계: 헤드리스 Chrome · Aside · iOS Simulator 결과는 실기기 iPhone PASS가 아니다. 이 Seed의 어떤 근거에도 '실기기 통과'를 적지 않고 실기기 검증은 S8 몫이다. Android 커버리지를 주장하지 않는다(#585)."
    hard: true
    rationale: "07-seeds S8, CLAUDE.md 🔬."
  - id: constraint-16
    type: other
    description: "착수 조건: 이 Seed가 소유자 승인으로 active이고 D18-1 A · D18-2 결정이 constraint-9 · 18에 반영돼 있다(2026-11-22 반영). 구현은 main 최신에서 워크트리 .claude/worktrees/826-s5 · 브랜치 feat/826-s5-landing으로 하고, 검증된 단위마다 Conventional Commits로 커밋 · push한다. PR · 머지는 소유자 승인 없이 하지 않는다. 진행 기록은 Seed가 아니라 #826 코멘트에 남긴다."
    hard: true
    rationale: "P1 · P21, CLAUDE.md Git 규약, 세션 goal(2026-11-22)."
  - id: constraint-17
    type: other
    description: "근거 원본: 마스터 docs/826-page-master 9bcf5585476e1f8cde64918e4e1f49091743a623(evidence/07-seeds.js S5 행, frames.js L-01~L-03 · landing(), master.css .c-gal · .c-lp · .c-resume · .c-legal-d, lib.js P.MOODS, data/trace.js l_carousel · l_gesture · l_reduced · l_card_enter · l_restore · l_ocr · l_poster · l_noposter · l_copy · l_footer · l_drop · REQ autoplay, evidence/02-decisions 6 · 03-open · 50-copy-locked · 51-copy-changed · 12-tokens-space · 20-flow-map), 결정 docs/826-s2-decisions 15e39c602b0749cad1adff6a56e03f5c8b851c7b, 캔버스 FILME 리뉴얼(https://claude.ai/artifact/4cvubgJpHC9ANQudDDoJ5F)의 D18, 선행 Seed docs/specs/826-s4-input-keyboard.yaml@7baded59bfed979b96338fbf02c2b649faf2a69c(closed · completed)."
    hard: true
    rationale: "세션 goal이 고정한 기준(2026-11-22 확인: #826 updatedAt 2026-11-22T01:19:27Z · 두 브랜치 SHA 일치, main 7baded59)."

  - id: constraint-18
    type: technical
    description: "모바일에서 지원하지 않는 기능 제거(trace l_drop, D18-2 소유자 결정 2026-11-22 '데스크톱을 없앨 거니까 모바일에서 지원 안 되는 기능 모두 제거'): 랜딩과 편집 캔버스의 포스터 드롭(Landing dropProps · dragOver 외곽선, MobileEditorShell posterDropProps · posterDragOver와 그 핸들러)을 걷고, 랜딩 전시의 마우스 올림 정지(constraint-4)를 걷는다. MobileEditorShell은 이 드롭 배선 제거와 Landing props 변경만 constraint-2 범위에 더한다. 키보드 포커스 정지 · 키보드 도달(constraint-4 · 5)은 iOS 외부 키보드 · VoiceOver 경로라 남긴다. 앱 전체의 데스크톱 축 제거(PhoneFrame 등)는 S5 밖이고 #826 후속으로 기록만 한다."
    hard: true
    rationale: "trace l_drop where '모바일에는 드롭 영역이 없어요. 포스터는 사진 모드와 랜딩 업로드로 넣어요', frames.js 머리말 '모바일 전용(데스크톱 축은 범위 밖)'. 근거 문장이 모바일 기준이고 드롭은 데스크톱에만 있는 사용자 경로라 소유자 결정."

success_criteria:
  - id: acceptance-1
    description: "bun run typecheck · bun run lint · bun run test가 모두 통과한다."
    verifiable: true
    measurable_via: "세 명령 종료 코드 0과 출력 요약"
  - id: acceptance-2
    description: "constraint-1 · 2: 착수 base 대비 렌더 파일(moods · TicketRenderer · captureToImage · public/assets/landing/hero-*.webp)과 범위 밖 파일(ImageCropModal · EditorMenu · ResultPanel · ResultStage · src/pages/t/** · EditorDock · InPlaceFieldEditor · KeyboardPanel)이 diff 0줄이고, src/utils/layouts.ts diff는 label 줄만(6줄 이하)이다."
    verifiable: true
    measurable_via: "git diff --stat <착수 base> -- 해당 경로 0줄 + git diff <착수 base> -- src/utils/layouts.ts 변경 줄 목록"
  - id: acceptance-3
    description: "constraint-3: 랜딩 상호작용 테스트에서 전시 컨테이너가 aria-roledescription='carousel' · aria-label='무드 전시'이고, 기둥과 위치 표시가 aria-hidden이며 위치 표시 글자가 '1 / 5'로 시작해 한 칸 넘길 때 '2 / 5'가 된다. 헤드리스 400×675에서 기둥 폭 ÷ 전시 폭이 0.62(±0.01), 가운데 카드 폭 ÷ 전시 폭이 0.52(±0.01), 좌우 카드가 0.34(±0.01) · 불투명도 0.32 · computed box-shadow none이고 좌우 카드 rect가 전시 rect 밖으로 전시 폭의 0.22(±0.01)만큼 나가 있고, 가운데 카드는 computed box-shadow가 none이 아니며, 가운데에서 2칸 떨어진 카드는 computed opacity 0이되 visibility visible · display가 none이 아니다(constraint-5와 함께 성립). 기둥은 computed border-left · border-right 1px, 위치 표시는 12px · font-variant-numeric tabular-nums다. 아래 판은 computed background가 --pr-s1 값, border-top-width 1px · 위 두 모서리만 radius > 0이고, padding-bottom 선언에 env(safe-area-inset-bottom)이 들어 있다(소스 grep). 착수 base 대비 랜딩 추가 줄에 gradient( · drop-shadow · blur( · rounded-full · 9999px가 없다."
    verifiable: true
    measurable_via: "상호작용 테스트 + 헤드리스 측정 스크립트 출력(rect 비 · computed opacity) + git diff 추가 줄 grep 0건"
  - id: acceptance-4
    description: "constraint-4: fake timer 테스트에서 3999ms 뒤 가운데가 그대로, 4000ms 뒤 한 칸 넘어간다. '자동 전시 정지' · '자동 전시 재개' 버튼이 없다. pointerdown 뒤 8000ms 동안 안 넘어가고 pointerup 뒤 4000ms에 넘어간다(pointercancel도 같다). 전시 안 버튼에 포커스가 있는 동안 8000ms 안 넘어가고 포커스가 전시 밖으로 나간 뒤 4000ms에 넘어간다. 마우스 pointerenter만으로는 멈추지 않는다(pointerenter 뒤 4000ms에 넘어간다). 길게 누른(350ms 초과) 뒤 떼면 무드로 들어가지 않고, 28px 스와이프마다 한 칸 넘어간다."
    verifiable: true
    measurable_via: "landingHeroMood 계열 상호작용 테스트(fake timer · pointer · focus 이벤트)"
  - id: acceptance-5
    description: "constraint-5: 전시 카드 버튼 5개가 모두 접근성 트리에 있고 tabIndex가 음수가 아니다. 가운데가 아닌 카드에 포커스를 주면 그 카드가 가운데(위치 표시 n이 그 카드)가 되고, 키보드 활성화(detail 0 click)로 그 무드로 들어간다."
    verifiable: true
    measurable_via: "상호작용 테스트(getAllByRole button 5개, focus 후 가운데 판정, Enter 진입)"
  - id: acceptance-6
    description: "constraint-6: 동작 줄이기 matchMedia 스텁에서 컨테이너 aria-label이 '무드 전시(동작 줄이기)'이고 카드 버튼 5개가 3열 격자(grid-template-columns 3등분 클래스 또는 스타일)로 서며, 8000ms가 지나도 아무것도 움직이지 않고 기둥 · 위치 표시가 없으며, 격자 컨테이너가 overflow-y auto(넘치면 전시 안 스크롤)다."
    verifiable: true
    measurable_via: "상호작용 테스트(matchMedia reduce 스텁)"
  - id: acceptance-7
    description: "constraint-7 · 8: 전시 카드는 '미니멀 · 크라이테리언 · 35mm · 에디토리얼 · 스텁' 5개이고 '35mm 와이드 무드로 바로 시작'은 없다. 각 aria-label이 정확히 '{label} 무드로 바로 시작'이고 title 속성이 없다. '스텁 무드로 바로 시작'을 누르면 layout이 stub인 새 문서로 편집 화면이 열린다. LayoutStrip 칩이 한글 label을 보인다. 에디토리얼 카드 안 이미지 래퍼에 rotate(90deg)가 그대로 있다. 오버레이가 걷힐 때 전환 스타일이 240ms · cubic-bezier(.2,.7,.2,1)이고 동작 줄이기면 전환이 없다."
    verifiable: true
    measurable_via: "상호작용 테스트(landingHeroMood · landingOverlay · landingFreshStart · landingMoodGalleryTapTargets 갱신분, LayoutStrip 렌더 단언)"
  - id: acceptance-8
    description: "constraint-9: 저장분 제목 '인터스텔라'면 복원 행 안에 '이어서 만들기'와 '인터스텔라'가 따로 있고 행이 주 CTA보다 DOM 앞이며 min-h가 56px 이상(min-h 클래스)이고, 위 줄이 12px · 아래 제목 줄이 15px · 600 글자 클래스이고 제목 줄에 한 줄 말줄임(truncate) 클래스가, › 아이콘에 aria-hidden이 있다. 제목이 비면 '제목 없는 티켓'이 보인다. 저장분이 없으면 행이 보이지 않는다(has-draft 게이트, landingPaintGate 통과). 누르면 문서가 그대로 편집 화면에 열린다(backToLandingPreservesDoc · landingFreshStart 통과). D18-1 A: 저장 시각이 2026-11-15인 저장분은 '11월 15일', 2025-11-15인 저장분은 '2025년 11월 15일'이 보이고(fake 현재 시각 2026년), 시각이 없는 옛 저장분은 날짜 요소 없이 행과 복원이 정상이며, 행 textContent에 마침표가 없다(landingOverlay 기존 단언 통과)."
    verifiable: true
    measurable_via: "landingOverlay · landingPaintGate · backToLandingPreservesDoc · landingFreshStart 상호작용 테스트"
  - id: acceptance-9
    description: "constraint-10: 랜딩에 summary '이용 고지'가 있는 details가 하나이고 기본은 닫힘이며, 고지 문구 · 크레딧 · GitHub 링크가 그 안에 있다. 헤드리스에서 summary rect 높이가 44px 이상이고 펼치면 › 아이콘의 computed transform이 접힘과 다르며, summary 글자는 12px · --pr-ink-3 클래스다. 랜딩을 떠난 편집 화면에는 고지 문구가 DOM에 없다(appFooterNotice 기존 부재 단언 통과). appFooterNotice 테스트가 기대값 변경 없이 통과한다. 헤드리스 400×675에서 접힘 · 펼침 두 상태 모두 랜딩 오버레이에 세로 스크롤이 없고(scrollHeight ≤ clientHeight), 펼친 상태의 전시 높이가 접힌 상태보다 작다."
    verifiable: true
    measurable_via: "상호작용 테스트 + 헤드리스 측정(두 상태의 오버레이 scrollHeight · clientHeight, 전시 rect 높이)"
  - id: acceptance-10
    description: "constraint-11: 인식 중 주 CTA가 '티켓 인식 중…' · aria-busy='true'이고 '포스터 업로드' · '포스터 없이 직접 입력' 버튼이 disabled다. 랜딩에서 연 인식의 안내 일곱 문구(실패 · 요청 많음 · 형식 · HEIC · 용량 · 인식된 정보 없음 · 영화 정보 못 찾음) 각각이 같은 자리 요소(위치 표시 자리)에 3000ms 보이다 사라지고 그동안 위치 표시가 없다. 그 자리 요소는 전시 컨테이너 안에 있고 DOM 순서상 주 CTA보다 앞이며, 헤드리스 rect로 아래 끝이 주 CTA 윗변보다 위다. 동작 줄이기 격자에서는 같은 안내가 격자 스크롤 영역 밖 요소에 뜬다. 인식 성공이면 랜딩이 걷히고 자동입력 배너가 보이는 편집 화면(E-05), 인식된 정보 없음이면 빈 편집 화면(E-02)이 된다. 형식 · HEIC · 용량 문구가 constraint-11의 새 문구이고, '지금 요청이 많아요…' · '인식된 정보가 없어요…'는 그대로다. 편집 화면에서 연 인식은 문구만 새 것으로 바뀐 채 notify 경로로 뜬다."
    verifiable: true
    measurable_via: "ocrFailureFlow · landingHeroMood · mobileEditorShellOcrEntryConsolidation 상호작용 테스트"
  - id: acceptance-11
    description: "constraint-12: 착수 base 대비 src의 '포스터 업로드' · '포스터 없이 직접 입력' · '티켓 스크린샷으로 자동입력' · 헤드라인 · 서브카피 문자열이 그대로이고, __tests__ diff에 이 다섯 문자열이 들어간 줄의 변경(삭제 · 수정)이 없다. 착수 base의 COPY_TONE_GUIDE 잠금 표 첫 행 9개 테스트(constraint-12 목록, constraint-13이 표를 고친 뒤에도 이 목록 기준)가 통과한다."
    verifiable: true
    measurable_via: "git grep 착수 base · HEAD 비교 + git diff <착수 base> -- __tests__ 에서 해당 문자열이 든 '-' 줄 0건(새 + 줄은 허용) + 착수 base의 잠금 표 첫 행 9개 테스트 결과"
  - id: acceptance-12
    description: "constraint-13: COPY_TONE_GUIDE 잠금 표의 각 행 테스트 목록이 git grep -l 결과와 같고, #826에 바뀐 요구 1 코멘트가 있으며, src에 '자동 전시 정지' · '자동 전시 재개' · CAROUSEL_SLOW_INTERVAL_MS · LONG_PRESS 늦추기(slowed) 상태 · 3500 간격이 남아 있지 않다."
    verifiable: true
    measurable_via: "잠금 표 행별 git grep -l 대조 + gh issue view 826 코멘트 + git grep 0건"
  - id: acceptance-13
    description: "constraint-14: bun scripts/measure-chrome.mjs --theme dark와 --theme light가 prod 빌드에서 exit 0이고 dock 249 / 프리뷰 219×350, 랜딩 · posterless · 프레임 봉쇄 축이 checked:true로 통과한다."
    verifiable: true

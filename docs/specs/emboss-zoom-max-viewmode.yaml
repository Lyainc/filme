blindspots:
  - area: 검증 도구가 이미 깨져 있다
    question: >-
      `scripts/capture-export.mjs`의 `--emboss`/`--lasso` 경로가 지금 못 돈다. `paintEmboss`(:271,
      술어 :276, throw :282)와 `paintEmbossLasso`(:342, 술어 :347, throw :352)가
      `'형압 칠하기 시작'` · `'올가미로 선택 시작'` 버튼을 찾고 없으면 throw하는데, 그리고 종료도
      `'탭해서 종료'`(:310·:391)를 찾는데, **그 버튼들은 더 이상 없다** — #692가 진입을 ChipRadio "형압 도구"
      칩 탭으로 바꿔서(designRailItems.tsx:365-380) 도구 칩 하나가 선택과 진입/종료를 다 맡는다.
      오늘 프로브 1회차가 같은 술어로 못 찾아(`embossStarted: false`) 확인된 사실이고, 라디오
      클릭으로 바꾼 2회차부터 진입했다. 이 스펙의 검증이 그 스크립트를 타면 시작부터 걸리므로,
      착수 시 먼저 고칠 것 — 다만 이건 이 스펙이 만든 결함이 아니라 물려받는 것이고, 별도 이슈로
      떼는 게 맞는지는 정하지 않았다.
  - area: 하네스가 못 보는 축
    question: >-
      `measure-chrome.mjs`의 max 축은 rect만 재고 **누가 그 픽셀을 받는지**는 안 잰다 — 그래서
      이 버그가 하네스 전부 통과 상태로 살아 있었다. ac1~ac3은 원리적으로 hit-test 축이라
      기존 게이트 어디에도 안 실린다. ac5가 그 대신 선언 결합만 required에 내리지만, 실제 히트
      테스트를 required 안에서 잴 방법은 이번 스펙 범위에 없다. 하네스에 hit-test 축을 새로 세울지는
      "잰다 ≠ 게이트에 실린다"(#714)와 같은 결정이라 별도 판단이 필요하다.
  - area: 클리핑과 히트 영역
    question: >-
      `getBoundingClientRect`는 조상 `overflow` 클리핑을 반영하지 않으므로, 원래는 "확대한 포스터가
      스테이지 밖으로 나가면 브러시 레이어가 안 보이는 자리의 UI 클릭을 먹는다"가 실비용이었다.
      **max 재사용이 이 비용을 대부분 지운다** — max 스테이지는 `inset-0`이라 프레임 전체이고 그
      위에 다른 UI가 없어서 가려질 것 자체가 없다. 남는 건 PhoneFrame `contain:paint` 밖으로 나가는
      경우인데 실측 배율 1.59×에서 포스터가 프레임 안에 여유 있게 들어와(여백 47.9~120.8px) 지금은
      발생하지 않는다. c7이 패닝을 안 여는 한 이 항은 잠들어 있다 — 패닝을 여는 순간 되살아난다.
  - area: 접근성
    question: >-
      max 진입 시 포커스가 티켓 래퍼로 옮겨가고(:612-614) 그 래퍼의 접근성 이름이 "기본 크기로
      돌아가기"인데, c2 이후 그 래퍼의 포스터 부분은 탭하면 칠해진다 — 이름과 동작이 자리마다
      갈린다. 브러시 레이어는 `aria-hidden="true"`고 이 저장소는 온-티켓 편집을 포인터 전용으로
      두기로 이미 정했으므로(EmbossBrushLayer.tsx:213-214) 키보드 경로는 여전히 "돌아가기" 하나로
      일관되지만, 스크린리더 사용자가 포스터 자리를 탭했을 때 무슨 일이 나는지는 안 정했다.


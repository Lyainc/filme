constraints:
  - id: c1
    type: technical
    description: >-
      시안 충실 구현이 기본선. 좌표·수치는 시안 그대로 가고, 시안이 답을 주지 않는 엣지케이스만
      개발 중 판단한다.
    hard: true
    rationale: >-
      시안은 4차에 걸쳐 확정됐고 개선 축(실물감·여백·인쇄 시인성)이 이미 시안 안에 반영돼 있다.
      개선 노트는 별도 판정 축이 아니라 작업 참고물이다.

  - id: c2
    type: technical
    description: >-
      렌더에 난수 금지. 필름 키코드·엣지 코드·풋 카운터는 기존 seedFromString 결정론 헬퍼를 쓴다.
    hard: true
    rationale: >-
      시안 스크립트는 Math.random()으로 렌더마다 새로 만들지만, html-to-image가 캡처 시점에
      DOM을 다시 그리므로 프리뷰와 결과물이 갈린다.

  - id: c3
    type: technical
    description: >-
      FieldTap/ghost 편집 배선 보존. 병합 라벨(Exhibited · The Film · Criterion 콜로폰 2줄)은
      fieldPieces로 분해해 필드별 독립 탭 타깃과 개별 ghost를 유지한다.
    hard: true
    rationale: >-
      구조가 통째로 바뀌므로 조각 매핑이 전면 재작업된다. 깨져도 화면에는 안 보이지만 편집이 죽는다.

  - id: c4
    type: technical
    description: 티켓 캔버스는 960×1534(0.626) 유지, 프레임 안 포스터는 0.667.
    hard: true
    rationale: >-
      #525에서 확정한 사이즈 정책 — 일반 포스터 0.667 / 캔버스 0.626 / 삽입 프레임 0.667.
      시안 프레임 560×840 · 500×750 · 926×617이 전부 그 규칙과 일치한다.

  - id: c5
    type: technical
    description: >-
      체인·포맷 스탬프를 상단 좌측 슬롯에서 크레딧 컷 하단 푸터 자리로 이동. 로고 미업로드 시
      라벨 텍스트로 폴백해 시안과 같은 그림을 만든다.
    hard: false
    rationale: 시안에 상단 스탬프 슬롯이 없고, 그 자리가 "CINE ROYALE · 70MM" 텍스트 줄이다.

  - id: c6
    type: technical
    description: 재개봉일은 값이 있을 때만 자리를 추가한다(평소엔 시안 그대로).
    hard: false
    rationale: >-
      시안 3무드 어디에도 재개봉 슬롯이 없으나 필드를 제외하면 기능 축소가 된다. 조판이
      데이터에 반응하게 해 시안 충실과 기능 보존을 양립시킨다.

  - id: c7
    type: technical
    description: >-
      Criterion 도판 양감(4단 그림자 + inset 엣지 + 사선 글로스 + 두께 엣지)은 무드 기본으로
      직접 그린다. #509(유저 커스텀 형압 후가공)와는 별개 이슈이며 로직 공유는 허용.
    hard: false
    rationale: 도판 양감은 무드 정체성의 일부(항상 적용)이고, #509는 사용자가 켜고 끄는 후가공이다.

  - id: c8
    type: technical
    description: >-
      themeColor는 시안 색을 하드코딩해 선행한다(35mm amber #a97433, Criterion 옐로 #f2c200).
      6무드 액센트 통일 개편은 별도 이슈.
    hard: true
    rationale: >-
      themeColor는 현재 무드마다 의미가 다르다 — 35mm/Wide/Editorial은 액센트 1색,
      Minimal/Criterion은 본문 잉크 전체 + isInkDark 반전, Stub은 무시. 6무드 공통 기능이라
      3무드 재설계와 축이 다르고, 하드코딩이 개편을 막지 않는다.

  - id: c9
    type: technical
    description: >-
      LayoutPicker의 MOOD_CHIP_BG · THUMBNAIL_RENDERERS를 새 실루엣으로 갱신한다.
    hard: false
    rationale: >-
      무드 실루엣이 거기 손으로 한 번 더 인코딩돼 있다(35mm=가로 밴드, criterion=어두운 분할).
      사용자가 무드를 고를 때 보는 유일한 화면이라 스테일하면 옛 디자인을 광고하게 된다.

  - id: c10
    type: technical
    description: >-
      __tests__/inkColorFidelity.test.tsx를 3무드 제외로 좁힌다. DesignRail의 ColorPicker
      비활성화 게이팅 확장은 이번 범위 밖.
    hard: false
    rationale: >-
      색 하드코딩이 "6무드 전부 themeColor→ink 파생"이라는 기존 단언을 깬다. 테스트 깨짐은
      이번에 막고, 죽은 피커 정리는 themeColor 개편 이슈로 넘긴다.

  - id: c11
    type: process
    description: PR 1개 · 무드별 atomic 커밋 3개.
    hard: true
    rationale: >-
      레포가 rebase merge라 커밋이 main에 verbatim으로 올라온다. PR은 하나로 묶되 커밋을
      무드 단위로 나눠 리뷰 가능성과 커밋 위생을 함께 지킨다.

  - id: c12
    type: technical
    description: 범위 밖 3무드(Minimal · Editorial · Stub)는 렌더가 바뀌지 않아야 한다.
    hard: true
    rationale: v5 시안이 6무드 중 3개만 다룬다. 나머지는 현행 유지가 명시적 경계다.

  - id: c13
    type: technical
    description: Criterion 본문 서체로 Noto Serif KR을 실을지는 미정 — 개발 중 실측 후 결정.
    hard: false
    rationale: >-
      현재 _app.tsx에 한글 세리프가 없고(JetBrains Mono · Instrument Serif · Nunito ·
      Share Tech Mono), 서브셋해도 무거워 로딩 비용과 시안 충실도를 저울질해야 한다.


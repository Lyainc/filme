  - id: acceptance-8
    description: "constraint-10: 라이트 테마로 결과 화면을 열면 루트에 .chrome-dark가 없고 html에도 chrome-dark 클래스가 붙지 않으며, 다크 테마면 루트가 .chrome-dark다. 두 테마 모두 data-testid='result-ambient' 요소가 결과 화면 루트의 직계 자식으로 있다. src/pages/index.tsx에 resultOpen으로 chrome-dark를 토글하는 코드가 없다."
    verifiable: true
    measurable_via: "chromeDarkScope · mobileChromeDarkHtmlBg(고친 판) + grep"
  - id: acceptance-9
    description: "constraint-11: getServerSideProps를 list mock으로 부르면 jpg 없음 · 빈 id · list throw 세 경우 모두 res.statusCode 404와 빈 상태 props를 돌려주고 notFound를 돌려주지 않으며 Cache-Control에 s-maxage를 걸지 않는다. 빈 상태를 렌더하면 '만료된 링크예요'와 href='/'인 '나도 티켓 만들기' 링크가 있고 og:image 메타 · 티켓 img가 없다. 기본 상태 CTA 텍스트는 정확히 '나도 티켓 만들기'다."

    description: "만료 문장과 고지 문구는 바꾸지 않는다(D21-3 A, COPY_TONE_GUIDE 제약 ②): 결과 화면과 공유 페이지의 만료 문장은 '이 링크는 {DEFAULT_TICKET_TTL_DAYS}일 후 만료돼요.'이고 일 수는 그 상수에서 읽는다. 비공식 고지는 UNOFFICIAL_TICKET_NOTICE 그대로다. 링크를 만들기 전에는 만료 문장을 보이지 않는다(마스터 R-01의 '3일 뒤 만료' 보조 문구는 두지 않음)."
    hard: true
    rationale: "D21-3 A(소유자 2026-11-23) · 마스터 R-02 '만료 문장과 비공식 고지는 현행 그대로' · 제약 ②(법적 고지는 톤 정비 대상 밖)."
  - id: constraint-9
    type: technical
    description: "공유 링크 비용 포스처: /api/ticket 발급은 [링크] 또는 [공유]를 누를 때만 일어난다. 결과 화면 진입, [저장], 테마 전환, 화면 크기 변화로는 발급하지 않고, 발급된 링크가 있으면 [공유]는 그것을 다시 쓴다."
    hard: true
    rationale: "소유자 목표 · 메모리 share-pipeline-cost-posture(Hobby 차단 한도) · resultPanelShareGating."
  - id: constraint-10
    type: technical
    description: "결과 화면은 앱 테마를 따른다(D21-5 A): ResultStage 루트는 테마가 다크일 때만 .chrome-dark 스코프와 앰비언트를 가지고, 라이트에서는 라이트 토큰으로 그린다(편집 셸과 같은 규칙, #415). index.tsx가 resultOpen일 때 html에 chrome-dark를 거는 강제를 걷는다. 하네스가 결과 화면을 기다리는 data-testid='result-ambient' 요소(또는 같은 이름의 결과 화면 표지)는 테마와 상관없이 결과 화면 루트의 직계 자식으로 남는다."
    hard: true
    rationale: "D21-5 A(소유자 2026-11-23) · D11 라이트 · 다크 그림 · 마스터 R-01. scripts/measure-chrome.mjs가 '[data-testid=\"result-ambient\"]'와 그 부모로 결과 스테이지 봉쇄를 잰다."
  - id: constraint-11
    type: technical
    description: "공유 페이지 만료 · 없는 링크(S-01, D21-4 A): getServerSideProps가 id가 비었거나 원본 jpg가 없거나 Blob 조회가 실패하면 notFound 대신 빈 상태를 그리는 props와 함께 HTTP 404 상태를 돌려주고, 이 응답에는 공유 성공 경로의 Cache-Control(s-maxage)을 걸지 않는다. 빈 상태는 워드마크(홈 링크) · 제목 '만료된 링크예요' · [나도 티켓 만들기](/로 가는 링크) 한 화면이고 티켓 이미지 · og:image 메타를 싣지 않는다. 기본 상태의 본문 · 만료 · 고지 문구는 그대로이고 CTA만 화살표를 뺀 '나도 티켓 만들기'다."
    hard: true
    rationale: "D21-4 A(소유자 2026-11-23) · 마스터 S-01 · 51-copy-changed '공유 페이지 만료'(신규) · '공유 페이지 CTA'. 404 상태는 크롤러 · 미리보기에 지금과 같은 신호를 준다."
  - id: constraint-12
    type: other
    description: "잠긴 문구와 축 3: docs/COPY_TONE_GUIDE.md '테스트가 잠근 문구' 표의 기존 행 문자열은 src · __tests__에서 바뀌거나 지워지지 않는다. 새로 쓰는 실패 문구는 축 3대로 한 문장이고 길이 상한(한 문장 33자)을 지키며, 라벨에는 조건절 · 종결어미 · 마침표가 없다(축 1 · 2). 임시저장 실패 토스트 두 문구(D20-4 A)는 바꾸지 않는다."
    hard: true
    rationale: "소유자 목표의 보호 조건 · CLAUDE.md COPY_TONE_GUIDE 포인터."
  - id: constraint-13
    type: technical
    description: "테스트 · 하네스 · 문서를 같은 변경에서 맞춘다: '사진에 저장' · '저장에 실패했어요.' · '다시 시도' · '실패, 다시 시도'를 잡던 resultPanelShareGating, 결과 화면 상시 chrome-dark를 잡던 chromeDarkScope · mobileChromeDarkHtmlBg, 워드마크를 전제한 resultStageWordmarkReset, 공유 페이지 shareLandingLayout을 새 동작으로 고친다. scripts/capture-export.mjs와 scripts/ios-sim/run768.py의 '사진에 저장' 버튼 선택자를 '저장'(정확일치 또는 접근 이름)으로 바꾼다. 새 결과 · 공유 문구를 테스트가 잡으면 COPY_TONE_GUIDE 잠금 표에 행을 더하고, 축 3 '이행' 문단에 S7이 결과 실패 문구를 옮겼다고 적는다. scripts/measure-chrome.mjs에는 결과 화면 새 축을 더하고 종료 조건(process.exitCode)에 싣는다: 배치 치수(acceptance-17), 통보 영역 봉쇄(acceptance-14), 400×675 · 400×667 프레임에서 경고 · 대체 칸 상태의 봉쇄(acceptance-16). 그 상태는 페이지 스크립트로 만든다(캡처 실패 스텁으로 저장 실패, navigator.clipboard.writeText reject 스텁 + /api/ticket 응답 스텁으로 대체 칸). docs/HARNESS.md에 새 축을 적는다."
    hard: true
    rationale: "CLAUDE.md 하네스 · 테스트 규칙(선택자는 exitCode에 실을 것) · COPY_TONE_GUIDE 잠금 표 운영."
  - id: constraint-14
    type: technical
    description: "프레임 축과 하네스 불변식: 결과 화면 크기 · 좌표 계산에 새 vw · vh · rail: · useMatchMedia를 넣지 않고 cq 단위 · @container · PhoneFrame 기준을 쓴다. prod 빌드에서 measure-chrome --theme dark · --theme light가 exit 0이고, dock 249 / 프리뷰 219×350 불변식과 '결과 스테이지' · '결과 hero' 프레임 봉쇄 축이 그대로 통과한다."
    hard: true
    rationale: "CLAUDE.md 셸 · 하네스 절(#603 · #607 · #609 · #707)."
  - id: constraint-15
    type: other
    description: "검증 표기: 헤드리스 하네스 · happy-dom · iOS Simulator 결과를 실기기 PASS로 쓰지 않고 Android 커버리지를 주장하지 않는다. 낮은 화면(667px 등)에서 티켓 · 버튼 줄 · 고지 배치와 공유 시트 · 클립보드 동작의 실기기 확인은 S8로 넘긴다."
    hard: true
    rationale: "CLAUDE.md 검증 도구 절 · 07-seeds S8 · D11 '위험'."
  - id: constraint-16
    type: other
    description: "작업 방식: 구현은 별도 워크트리 · 브랜치에서 하되 이 Seed 브랜치(docs/826-s7-seed)에서 갈라 그때의 origin/main 위로 올리고, 착수 base 커밋을 검증 기록에 적는다. 커밋은 Conventional Commits(type(scope): 설명 (#826))로 atomic하게 나눈다. 이 Seed 브랜치(docs/826-s7-seed)는 구현 PR에 함께 들어간다. PR 개설과 머지는 소유자 승인 뒤에만 한다. 마스터 frames.js R-01~R-03 · 51-copy-changed · 30-errors-index를 D21 결정에 맞추는 일은 docs/826-page-master 브랜치에서 따로 한다."
    hard: true
    rationale: "소유자 목표 · S5 · S6 선례 · CLAUDE.md Git 규약."
  - id: constraint-17
    type: technical
    description: "결과 화면 통보의 자리: ResultStage가 자기 루트(PhoneFrame 안) 위쪽에 통보 영역을 갖고, '저장했어요' · '링크를 복사했어요'는 여기에 뜬다. 이 영역의 live region(role=status)은 결과 화면이 열려 있는 동안 늘 마운트돼 있고 글자만 바뀐다(통보 순간에 새로 마운트하지 않음). 결과 화면이 열려 있는 동안 편집 셸에서 떠 있던 지속 오류 토스트는 결과 화면 위에 겹쳐 보이지 않고, 결과 화면의 동작은 showError를 부르지 않는다. 결과 화면에는 도크가 없어 X-01의 '통보는 도크 위' 규칙 대신 R-03대로 위쪽(위 줄 아래, 티켓 위)에 띄우고, X-01의 '오류 문장은 무슨 일 한 줄 · 다음 행동은 버튼' 규칙은 constraint-6이 따른다."
    hard: true
    rationale: "맹점 1(소유자 채택 2026-11-23): resultOpen이면 index.tsx:96이 편집 셸 래퍼를 hidden으로 만들고, 유일한 ErrorToastHost(MobileEditorShell.tsx:927)와 sr-only status가 그 안에 있어 결과 화면에선 보이지 않는다(ResultPanel.tsx:219의 showError도 마찬가지)."
  - id: constraint-18
    type: technical
    description: "클립보드가 거부돼 대체 링크 칸이 처음 나타날 때, 링크 칸이 마운트된 뒤에(effect · autoFocus 등) 그 칸에 포커스를 주고 글자 전체를 선택한다. 마운트 전의 ref에 select()를 부르는 것으로 이 요구를 채운 것으로 보지 않는다."
    hard: true
    rationale: "맹점 2(소유자 채택 2026-11-23): 지금 copyToClipboard의 catch(ResultPanel.tsx:243)는 linkInputRef.current?.select()를 바로 부르는데, constraint-7대로 칸이 대체 때만 렌더되면 이 시점 ref가 null이라 아무 일도 하지 않는다."
  - id: constraint-19
    type: technical
    description: "경고 상자(constraint-6)나 대체 링크 칸(constraint-7)이 나타나도 티켓 크기는 바뀌지 않고, 세 버튼과 비공식 고지가 결과 화면 스크롤 없이 PhoneFrame 안에 보인다(세로 예산에 미리 넣거나 버튼 줄 위에 겹쳐 띄우는 방식 중 구현이 고른다). 400×667 프레임에서도 같다."
    hard: true
    rationale: "맹점 3(소유자 채택 2026-11-23): hero 폭은 고정 세로 예산(--hero-dvh-budget, ResultStage.tsx:45)에서 나오고 루트 높이는 100cqh(:60)라, 예산 밖 요소가 끼어들면 667px에서 버튼 줄 · 고지가 밀리거나 티켓이 튄다."

success_criteria:
  - id: acceptance-1
    description: "constraint-1: git diff <착수 base>..<검증 커밋> -- src/components/moods src/components/TicketRenderer.tsx src/utils/captureToImage.ts src/utils/layouts.ts가 0줄이다."
    verifiable: true
    measurable_via: "git diff 출력"
  - id: acceptance-2
    description: "constraint-2: 결과 화면을 렌더하면 TicketRenderer가 둘(보이는 것 · 화면 밖 캡처 대상) 있고 둘 다 ghost=false로 같은 props를 받으며, 캡처 대상의 바깥 래퍼가 display:none이 아니다. resultGhostOff가 통과한다."
    verifiable: true
    measurable_via: "resultGhostOff(또는 옮긴 파일) 상호작용 테스트"
  - id: acceptance-3
    description: "constraint-4 · constraint-5: 결과 화면에 접근 이름 '편집으로 돌아가기' 버튼과 '저장' · '링크' · '공유' 버튼이 있고 워드마크 · '1960 × 3108' 텍스트가 없으며, 비공식 고지 문구가 링크 발급 전후 모두 보인다. '새 티켓 만들기'가 없다. 저장 성공 mock에서 '저장했어요'(role=status)가 뜨고, 공유 시트 취소 mock에서는 뜨지 않는다. 저장 중에는 '저장' 버튼이 aria-busy이고 '링크' · '공유'가 disabled다."
    verifiable: true
    measurable_via: "testing-library 상호작용 테스트(captureToImage mock)"
  - id: acceptance-4
    description: "constraint-6: 저장 실패 mock에서 role=alert에 '저장하지 못했어요'가 뜨고 '다시 시도' 이름의 버튼이 없으며, '저장'을 다시 누르면 캡처가 다시 호출된다. 링크 발급 실패 mock에서 role=alert에 '링크를 만들지 못했어요'가 뜨고 showError가 불리지 않으며 '실패, 다시 시도' 텍스트가 없다. src에 '링크 생성에 실패했어요' · '실패, 다시 시도'가 없다."
    verifiable: true
    measurable_via: "상호작용 테스트(showError 스파이 · fetch mock) + grep"
  - id: acceptance-5
    description: "constraint-7: 링크 발급 성공 + clipboard.writeText 성공이면 '링크를 복사했어요'(role=status)가 뜨고 링크 칸이 없다. clipboard.writeText가 reject면 읽기 전용 입력(aria-label '공유 링크', computed font-size 16px 또는 text-[16px] 계열 클래스)이 보인다. navigator.share가 없을 때 '공유'를 누르면 발급 후 복사되고 같은 통보가 뜬다. AbortError면 복사 · 통보가 없다. 링크가 없는 상태에서 '공유'를 눌러 발급이 실패하면(fetch reject) navigator.share · clipboard.writeText가 0회이고 role=alert '링크를 만들지 못했어요'만 뜨며 '링크를 복사했어요'가 없다."
    verifiable: true
    measurable_via: "상호작용 테스트(navigator.clipboard · navigator.share 스텁)"
  - id: acceptance-6
    description: "constraint-8: 링크 발급 전에는 '만료돼요' 문장이 없고, 발급 뒤 결과 화면과 공유 페이지 기본 상태 모두 '이 링크는 3일 후 만료돼요.'(DEFAULT_TICKET_TTL_DAYS=3)와 UNOFFICIAL_TICKET_NOTICE 문자열을 그대로 보인다."
    verifiable: true
    measurable_via: "상호작용 테스트 + static-markup 테스트"
  - id: acceptance-7
    description: "constraint-9: 결과 화면 진입 · '저장' 클릭 · 테마 전환에서는 fetch('/api/ticket')가 0회이고, '링크' 클릭은 1회, 링크가 있는 상태의 '공유' 클릭은 추가 0회다. resultPanelShareGating이 통과한다."
    verifiable: true

blindspots: []
blindspot_disposition:
  long_content: 답변을 c7·c8·ac2에 반영했다. 무조건 전체 펼침 대신 자연스러운 요약과 원문 접근을 요구한다.
  theme_consistency: 답변을 c3·ac1에 반영했다. 현재 앱은 전체 라이트이며 추후 다크도 전체 단위로 적용한다.
  text_resize_200: 사용자가 필요성에 의문을 제기해 이번 필수 조건에서는 제외했다. 기본 확대 기능은 보존한다.
  reference: https://www.w3.org/WAI/WCAG22/Understanding/resize-text.html

deferred:
  - 본 리디자인 구현·검증 완료 후 다크 테마 팔레트 후보를 몇 가지 비교한다. 이번 Seed에서 후보 수나 팔레트를 선결정하지 않는다.
  - 200% 확대 전용 검증은 이번 완료 조건이 아니다. 이를 검증하지 않고 WCAG AA 전체 준수를 주장하지 않는다.


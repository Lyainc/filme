# Seed Spec — 배경 이미지를 '스탬프'로 재설계
---
skill: build-spec
schema_version: 1
version: 4.7.0
generated: 2026-08-18
input:
  target: 배경 이미지를 '스탬프'로 재설계
  options: []
output:
  type: spec
  structure: templates/SEED_SPEC.yaml

spec_version: 1
created: 2026-08-18
target: 배경 이미지를 '스탬프'로 재설계
domain: tech
brownfield: true
refine_generation: 0

goal:
  statement: >-
    사용자가 올린 이미지를 캔버스 전면 cover로 깔던 '배경'을, Criterion·Editorial·Stub 세 무드에서
    각각 그 무드가 정한 고정 자리에 박히는 '스탬프'로 바꾼다. 사용자는 위치를 고르지 않고 크기와
    투명도만 정하며, 새로 올린 스탬프는 반투명으로 시작하되 이미 저장된 배경은 지금 렌더 그대로
    보인다.
  clarity_score: 0.9

constraints:
  - id: c1
    type: business
    description: >-
      사용자에게 보이는 이름은 '스탬프'로 간다. 레일 항목 라벨 '배경'(designRailItems.tsx:779)과
      슬라이더 라벨 '배경 크기'(:612), `img alt` '배경 이미지'(:596),
      `aria-label` '배경 이미지 업로드'(:634)가 그 이름으로 옮겨간다.
    hard: true
    rationale: >-
      오너 확정. 이 저장소에서 '스탬프'가 이미 두 가지를 뜻해 3중 충돌이라고 보고했고, 오너가
      그대로 가기로 했다. 충돌의 실제 모양과 그게 어디를 문다는 판단은 blindspots에 전수로 적어뒀다
      — 요약하면 **사용자 노출 문자열 층에서는 충돌이 0이고**(전수 확인: '스탬프'라는 단어를
      사용자에게 보여주는 자리가 src에 하나도 없다. 로고 축은 '로고', 형압 축은 '형압'으로 노출된다)
      **내부 식별자 층에서만 문다.**
  - id: c2
    type: technical
    description: >-
      대상 무드는 Criterion · Editorial · Stub 셋이다. 이건 **이미 그 상태라 코드 변경이 0인 절이다**
      — `BACKGROUND_PATTERN_MOODS`(designRailItems.tsx:550)가 정확히 그 셋이고 minimal·35mm·35mm Wide는
      배경 코드가 한 줄도 없다. 원 요청의 "그 셋에만 추가"는 no-op으로 기록하고 넘어간다.
    hard: true
    rationale: >-
      no-op을 명시적으로 안 적으면 착수자가 "세 무드에 추가"를 할 일로 읽고 없는 작업을 찾는다.
      판정 기준("배경을 깔 종이 바탕이 그 무드에 실재하는가", :545-549 주석)도 그대로 유효하다.
  - id: c3
    type: technical
    description: >-
      위치는 무드가 정한다. 사용자에게 오프셋·정렬 컨트롤을 열지 않는다.
    hard: true
    rationale: >-
      오너 확정. #680이 같은 판단을 이미 한 번 했고(그 스펙 c6 — 크기 패널이 scrollHeight 199 vs
      슬롯 115px로 넘치는데 컨트롤 2개는 세로 예산을 두 배로 먹는다) 슬롯 사정은 그대로다.
      고정 배치라 `transform-origin`·`backgroundPosition` center 고정도 그대로 성립한다.
  - id: c4
    type: technical
    description: >-
      투명도는 새 옵셔널 필드(`TicketComponents`)로 싣고 렌더는 `?? 1`로 읽는다. 기존 저장본은
      필드가 없으니 1.0 = 지금 렌더 그대로다. "새로 올린 것만 반투명"은 마이그레이션이나 렌더
      분기가 아니라 **업로드 콜백에서 값을 명시적으로 써 넣어** 만든다 —
      `useLogoCrop`의 완료 콜백(designRailItems.tsx:576-579)이 이미지와 투명도를 한 번에 커밋하되,
      사용자가 이미 값을 고른 적이 있으면(`?? 기본값`) 그 값을 유지한다.
    hard: true
    rationale: >-
      `backgroundPatternScale`이 `?? 1`로 기존 렌더 무변경을 지킨 것과 같은 관용구다
      (types/index.ts:118-127, quoteFont·signatureScale·posterFit이 전부 같은 처방).
      "새 업로드에만"을 렌더 쪽에서 분기하려면 "이 이미지가 언제 올라왔는가"를 새로 저장해야 하는데,
      쓰기 시점에 값을 확정하면 그 축이 통째로 사라진다. 커밋을 한 번에 묶는 건 undo 히스토리
      때문이다 — 이미지와 투명도를 따로 쓰면 undo 한 번이 반쯤 되돌린 상태를 만든다.
  - id: c5
    type: technical
    description: >-
      크기·투명도 컨트롤은 `BrightnessSlider`를 그대로 쓴다. 새 컴포넌트·새 모듈 0.
    hard: true
    rationale: >-
      오너 확정이고 이미 크기 슬라이더가 그걸 쓴다(designRailItems.tsx:607-618).
      `shouldCommitSliderValue`가 드래그 중 undo 폭주를 이미 막아뒀고(#507), 라벨 줄에 액션을
      접는 `action` prop도 있어(형압 패널의 '지우기'가 쓰는 자리) 패널 세로 예산에도 유리하다.
  - id: c6
    type: technical
    description: >-
      스탬프 레이어는 `componentOpacity` 래퍼 **밖**에 선다. 세 무드 공통 계약이고 이번 재설계가
      이걸 바꾸면 안 된다.
    hard: true
    rationale: >-
      "종이에 이미 인쇄된 바탕"이라 조판 오버레이 페이드에 딸려가면 안 된다(#530 계약).
      `__tests__/designRailBackgroundPattern.test.tsx:142-150`이
      `closest('[style*="opacity"]')`를 null로 잠그고 있다. **다만 스탬프는 배경보다 조판에 가까운
      물건이라 이 계약이 여전히 맞는지는 재확인 대상이다** — 자리를 옮기는 것과 투명도 축이 새로
      생기는 것이 겹치므로, 계약을 바꾸기로 하면 그 테스트도 같이 뒤집는 것이지 조용히 넘어갈
      일이 아니다.
  - id: c7
    type: technical
    description: >-
      상태 필드 `backgroundPatternImage`(types/index.ts:105-117)는 개명하지 않는다. 새 필드
      (투명도)만 붙인다.
    hard: true
    rationale: >-
      이미 저장된 draft의 키라 개명하면 기존 저장물이 조용히 유실된다 —
      `backgroundPatterns.tsx:11-12`가 #672에서 정확히 같은 이유로 "사용자에게 보이는 이름만
      바꿨다"고 적어뒀다. 이번 개명도 그 선례를 그대로 탄다. IDB 키 `'background'`
      (`src/utils/imageDb.ts:11`)도 같은 이유로 그대로다.
  - id: c8
    type: technical
    description: >-
      고정 배치가 포스터와 안 겹치는 게 확정되면 `PATTERN_CLIP` 둘(MoodCriterion.tsx:92-94,
      MoodStub.tsx:84-86)을 지운다. 다만 Stub의 계약 둘 — 절취선이 위치지정 형제라 안 덮인다
      (MoodStub.tsx:221), 페이퍼 스텁이 배경을 다시 칠하지 않는다(:225-229) — 은 **전면 배경을
      전제로 쓰인 것**이라 같이 재검토한다.
    hard: false
    rationale: >-
      clip은 "전면 배경이 포스터 자리를 파낸다"는 명제의 구현이라, 배경이 전면이 아니게 되면
      존재 이유가 소멸해 오히려 단순해진다. 지우는 게 위험한 건 저장물 z-order 때문인데
      (#490/#495 `collectOpaquePosterBackdrops` — 포스터 조상의 불투명 배경은 base에서 빠지므로
      그 자리에 깔린 레이어가 포스터 **위**로 인쇄된다) 스탬프 박스가 포스터 슬롯과 안 겹치면
      그 경로 자체가 안 열린다. `__tests__/designRailBackgroundPattern.test.tsx:153-166`(clip-path
      값)·`:229-247`(stub 둘)이 이 셋을 잠그고 있어 셋 다 테스트를 같이 고쳐야 한다.
  - id: c9
    type: technical
    description: >-
      Stub의 스탬프 자리는 **저장물 실측으로 확정한다.** `scripts/capture-export.mjs`로 Stub 저장물을
      떨어뜨려 실제로 비는 자리를 재는 것이 이 스펙의 완료 조건이다(ac5).
    hard: true
    rationale: >-
      오너 확정이고, Stub만 자리를 도면에서 못 읽는다. 하단 페이퍼 스텁이 절대 좌표가 아니라
      플로우 레이아웃이고 `justifyContent: 'space-evenly'`(MoodStub.tsx:295)가 남는 세로를 필드
      개수에 따라 재분배하며, `Row`가 `label + 점선 필러(flex:1) + 값`이라 가로도 항상 꽉 찬다 —
      필드를 몇 개 켰느냐로 빈자리가 움직인다. 안정적 앵커 후보 셋과 각각의 함정은 context에
      적어뒀다.
  - id: c10
    type: technical
    description: >-
      `BackgroundPatternLayer`의 두 겹 구조(backgroundPatterns.tsx:49-63)는 clip이 남는 한 유지한다.
      c8로 clip이 사라지면 그때 한 겹으로 합칠지 정한다.
    hard: false
    rationale: >-
      두 겹인 이유가 clip 하나뿐이다(`:28-32` — clip-path는 로컬 좌표계에서 정의된 뒤 요소 전체가
      transform되므로 배율을 같은 요소에 걸면 clip까지 확대된다). 그 주석은 "배율에 따라 DOM 모양이
      갈리면 조건부 JSX depth 분기가 되고 이 레포는 그걸로 이미 한 번 remount에 데였다"도 같이
      적어뒀으니, 합치더라도 상태별로 겹 수가 갈리면 안 된다.

success_criteria:
  - id: ac1
    description: >-
      세 무드에서 스탬프가 무드별 고정 박스 안에만 그려지고, 캔버스 전면을 덮지 않는다.
    verifiable: true
    measurable_via: >-
      `__tests__/designRailBackgroundPattern.test.tsx` 확장 — 지금 `backgroundSize: 'cover'` +
      `inset: 0`을 기대하는 자리(:136-137)를 무드별 고정 좌표 기대로 바꾼다. 12케이스 중
      `:125`(이미지 반영)·`:153`(clip-path)·`:170`(배율이 안쪽 겹에만)이 직접 대상이다.
  - id: ac2
    description: >-
      기존 저장본(투명도 필드 없음)의 렌더가 안 변한다 — 투명도 1.0으로 읽힌다.
    verifiable: true
    measurable_via: >-
      같은 테스트 파일 — 투명도를 안 건드린 채 이미지만 올린 상태의 레이어 `opacity`가 기본값인지.
      `backgroundPatternScale`의 `?? 1`이 같은 명제를 이미 지키는 방식과 대칭이다.
  - id: ac3
    description: >-
      새로 업로드한 스탬프는 반투명으로 시작하고, 사용자가 값을 고친 뒤 이미지를 교체하면 그 값이
      유지된다.
    verifiable: true
    measurable_via: >-
      상호작용 테스트 — 업로드 → 투명도 슬라이더 값이 기본값(1.0 아님) → 슬라이더 조작 → 이미지
      교체 → 조작한 값 유지. c4의 "쓰기 시점 확정"이 실제로 그렇게 도는지 잠그는 유일한 케이스다.
  - id: ac4
    description: >-
      크기·투명도 값이 무드 왕복과 새로고침을 넘어 살아남는다.
    verifiable: true
    measurable_via: >-
      같은 테스트 파일의 기존 "무드를 왕복해도 배경 이미지가 보존된다"(:205-227)에 투명도를 추가.
      그 케이스가 이미 `background-pattern-scale` testid를 왕복 확인하고 있다.
  - id: ac5
    description: >-
      Stub의 스탬프 자리가 실제 저장물에서 조판과 안 겹친다. **자리는 실측으로 정하고, 정한 뒤
      실측으로 확인한다.**
    verifiable: true
    measurable_via: >-
      `bun scripts/capture-export.mjs --layout stub --bg --out <경로>`로 저장물을 떨어뜨려 빈자리를
      읽고, 자리를 정한 뒤 `--compare`로 스탬프 있는 판/없는 판을 대조해 조판 영역의 채널 최대
      절대차가 허용치 3(하네스 잡음 바닥 maxΔ 2) 안인지 본다. 필드를 다 켠 상태와 최소로 켠 상태
      둘 다 떠야 한다 — `space-evenly`가 빈자리를 필드 개수로 재분배하므로 한 판만 보면 c9의
      함정에 그대로 빠진다.
  - id: ac6
    description: >-
      Criterion·Editorial에서도 스탬프가 조판을 안 가린다.
    verifiable: true
    measurable_via: >-
      같은 `capture-export.mjs --bg --compare`. 두 무드는 자리를 도면에서 읽을 수 있으므로(context의
      좌표) 확인만 하면 된다.
  - id: ac7
    description: >-
      레일 라벨·슬라이더 라벨·`alt`·`aria-label`이 '스탬프' 어휘로 일관되게 바뀌고, 라벨 규칙을
      어기지 않는다.
    verifiable: true
    measurable_via: >-
      `docs/COPY_TONE_GUIDE.md` 판별 두 가지 — 라벨(`aria-label` 포함)에 조건절·종결어미·마침표가
      없을 것, 실패·차단 문구는 [무슨 일] + [다음 행동] 두 문장이고 길이 상한(한 문장 33자·전체
      44자)을 지킬 것. 테스트 쪽 대상은 `designRailBackgroundPattern.test.tsx:77`·`:92`·`:95`가
      `name: '배경'`으로 버튼을 찾는 자리다(문자열이 바뀌면 같이 깨진다).


    id 필드를 걷어내 "이미지 하나가 축 전체"로 만들었고, **#680**이 배율 슬라이더를 붙였다.
    **#673**은 blob 수명·용량 축으로 열려 있고 배경을 "제일 큰 payload"로 지목하므로, 스탬프가
    작아지면서 `useLogoCrop`의 maxSide를 내릴 수 있는지가 그 이슈와 만난다 — 직교가 아니라 닿는다.
    한계: 예산 절삭으로 열린 이슈 본문은 앞부분만, 닫힌 이슈는 제목만 봤다.


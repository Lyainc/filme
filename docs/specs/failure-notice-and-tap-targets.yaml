blindspots:
  - area: blind-spots
    question: >-
      C3(좌석 5번째부터 무음 절삭)의 정책이 아직 없다 — 4개 상한을 유지하고 안내만 붙일지,
      4개 이상을 verbose로 처리할지. 진단문서 부록 2 UNRESOLVED 3번에도 같은 항목이 올라 있다.
      제약 자체는 타당하고 문제는 침묵뿐이므로 어느 쪽으로 가든 안내는 필요한데, 문구가 정반대라
      정책이 먼저다. 이 스펙이 c7로 명시적으로 제외했다.
  - area: blind-spots
    question: >-
      ac1을 유닛 테스트로 못 잠근다. happy-dom엔 실 레이아웃이 없어 rect가 전부 0이고,
      크롬 하네스(chrome-harness.yml)는 required check가 아니다(#593의 두 축 분리 — 브라우저·
      서버·타이밍 잡음이 required를 흔들면 안 된다는 자세). 그래서 이 회귀는 머지를 못 막는다.
      #714가 같은 문제를 만나 "결합만이라도 bun test로 내리는" 우회를 썼는데
      (measureChromeBaselineCoupling.test.ts가 문자 비교로 '다시 재라'를 띄운다), 좌표 클래스
      문자 비교도 같은 급의 얕은 가드다 — 실제로 겹치는지가 아니라 선언이 같은지만 본다.
  - area: blind-spots
    question: >-
      스낵바를 어디로 옮길 것인가가 미정이다. 위(top)로 올리면 ErrorToastHost(fixed top-4
      z-[70])와 새로 겹치고, 배너 위로 올리면 400×675 프레임에서 티켓 프리뷰를 덮으며,
      배너 아래는 자리가 없다. "배너가 떠 있을 때만 스낵바를 밀어 올린다"는 조건부 좌표가
      제일 좁은 답 같지만 상태 결합을 하나 새로 만든다. 이 선택은 실제 프레임에서 보고 정해야 한다.
  - area: blind-spots
    question: >-
      c4를 실제로 60곳 치환할 값어치가 있는가. 값이 전부 같은 `active:scale-[0.97]`이라
      사용자에겐 지금도 동일하고(진단문서 부록 2 ②에서 UX가 탭 타깃 3벌을 두고 편 논리와 같다),
      c8의 이식 논리로 보면 v2/* 스타일은 앱으로 안 넘어간다. 강제력이 필요하다는 명제는 참이나
      그것이 60곳 치환을 함의하지는 않는다 — eslint 규칙으로 새 리터럴만 막고 기존은 그대로
      두는 쪽이 더 쌀 수 있다(부록 2 ②의 "강제력의 최소 단위는 라이브러리가 아니라 lint 규칙").
      c4를 soft로 둔 이유가 이것이고, 착수 전에 한 번 더 판단할 자리다.
  - area: blind-spots
    question: >-
      진단문서에 아직 안 닫힌 항목이 더 있다 — C6(Web Share 타임아웃 부재, 실기기 미확인) ·
      M7(InPlaceFieldEditor만 Escape 미지원) · M9(툴바 숨김 시 undo 진입점 소멸, #681이 부분
      처리) · M10(자동저장 토글 고급설정 이동) · m1·m2(폰트·무드 청크 로딩) · m4~m11 잔여.
      이 스펙은 권장 1·3번의 잔여만 다루므로 그것들은 범위 밖이고, 대신 진단문서 자체가
      2026-08-04 스냅샷이라 다음에 인용할 때도 live source 대조를 먼저 할 것.


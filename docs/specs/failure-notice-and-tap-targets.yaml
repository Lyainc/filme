    rationale: >-
      실측 대조: OcrUndoBanner.tsx:27과 MobileEditorShell.tsx:1310이 문자까지 같은 좌표 클래스를
      쓰고 스낵바가 z-index로 위다. 배너는 자동으로 안 사라진다 — useOcrUndo.ts에 타이머가 없고
      snapshot은 cancel()/confirm()으로만 null이 되므로, 배너가 떠 있는 창은 사용자가 결정할

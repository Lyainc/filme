      한쪽이 다른 쪽을 지우는 셈이라, 진단문서가 "되돌리기가 세 갈래로 분리"라고 적은 축의
      실제 충돌 지점이다.
  - id: c4
    type: technical
    description: >-
      눌림 피드백은 pressableVariants로 강제한다. 새 값을 만들지 않고 지금 리터럴
      `active:scale-[0.97]`을 그대로 이식한다.
    hard: false
    rationale: >-
      #647이 variant를 만들었지만 소비자가 둘뿐이다(OcrUploadCard.tsx:282, PrimaryCta.tsx:45).
      나머지 60곳은 여전히 리터럴이라, #647 Critical Practitioner 조건 2("variant만 만들고 직접
      클래스를 계속 쓰면 4벌째가 생긴다")가 아직 안 지켜졌다. eslint local rule
      no-raw-touch-target-size(eslint.config.mjs:71,74)는 탭 타깃 **크기**만 막고 눌림 클래스는
      안 막는다. hard가 아닌 이유는 60곳 치환이 diff 크기로 리뷰 품질을 떨어뜨릴 수 있어서다 —
      진단문서 부록 2에서 Maintainability가 든 근거("diff 크기가 리뷰 품질의 천장")가 그대로
      적용된다. 한 커밋에 몰지 말고 나눌 것.
  - id: c5
    type: technical
    description: >-
      모션은 눌림 피드백의 **이징 하나만** 손댄다. 스프링 정착
      cubic-bezier(0.34, 1.56, 0.64, 1)을 얹되 pressableVariants의 **base가 아니라
      `transition: 'cta'` variant에만** 넣는다. translateY 같은 새 transform 축은 안 만든다.
    hard: true
    rationale: >-
      오너 결정("애니메이션이 너무 많으면 느려질 수 있으니, 애니메이션보다 UI 측면에서의
      개선에 주력"). base에 넣으면 안 되는 이유는 variants.ts:6-11이 못박아뒀다 — base는
      transition-property를 일부러 안 들고 있고, Tailwind의 transition-colors와
      transition-transform이 같은 CSS `transition-property` 선언이라 이미 transition-colors를
      쓰는 버튼(대다수)에 얹으면 나중 것이 통째로 이겨 호버 색 전환이 조용히 사라진다.
      `transition: 'cta'`는 이미 확장 property 목록(transform 포함)을 명시적으로 들고 있어
      이징만 갈아끼우면 되는 유일하게 안전한 자리다. 참고 값 출처는 외부
      (https://kinetics.colorion.co/ Push Button: transform 0.06s ease + :active translateY(5px)),
      그중 translateY는 채택하지 않는다 — 축을 하나 더 여는 만큼 실기기에서 잰 적 없는 비용이
      늘고, 오너가 최소로 하라고 한 자리다.
  - id: c6
    type: technical
    description: >-
      아직 무음인 실패 하나 — 포스터 추천색 추출 실패(src/pages/index.tsx:77 `.catch(() => {})`)
      — 를 기존 showError에 태운다. 새 진입점을 만들지 않는다.
    hard: false
    rationale: >-
      진단문서 Minor 목록(m4~m11)의 "색상 추출 실패 무음"이 유일하게 남은 무음 경로다
      (src 전수 스캔 결과 빈 catch는 index.tsx:64 테마 localStorage · :77 색상 추출 ·
      _document.tsx:23 인라인 테마 스크립트 셋뿐이고, 앞뒤 둘은 사용자가 잃는 게 없어 대상이
      아니다). 실패하면 ColorPicker의 추천색 2칸이 조용히 안 뜨는데, 사용자는 "이 포스터엔
      추천색이 원래 없나 보다"로 읽는다. 한 줄이라 c4와 달리 diff 비용 논쟁이 없다.
  - id: c7
    type: scope
    description: >-
      C3(좌석 5번째부터 무음 절삭, usePhototicket.ts:53-57·:350 capSeatTokens)은 범위 밖이다.
    hard: true
    rationale: >-
      진단문서가 "오너 정책: 4개 이상 verbose 처리 검토 중(미확정)"으로 남겨뒀고, 권장 순서
      2번도 "정책 확정 후"가 조건이다. 안내 문구는 상한을 유지하느냐 verbose로 가느냐에 따라
      정반대로 쓰이므로, 정책을 정하지 않고 문구부터 만들면 두 번 쓰게 된다. blindspots에 남긴다.
  - id: c8
    type: technical
    description: >-
      정당화 논리 — 실패 알림·상태 경로는 iOS로 이식되지만 웹 UI 스타일 리팩터링은 이식되지
      않는다. 그래서 c3·c6(상태·에러 경로)은 하고, c4·c5(스타일)는 최소로 한다.
    hard: true
    rationale: >-
      docs/NATIVE_IOS_RFC.md §1이 `src/components/v2/*`·`ui/*`·`wizard/*` **7,174줄을
      "재작성 대상 — 가장 큰 덩어리"**로 분류했고, 훅 1,448줄은 "상태 로직은 이식, 영속은 교체"다.
      §6 "여전히 하지 말 것"은 영속 계층 추상화·API 클라이언트 계층 신설·캡처 파이프라인
      인터페이스화를 순손실로 분류했다 — 앱에서 사라질 것에 구조를 씌우지 말라는 규율이고,
      같은 잣대를 대면 v2/* 스타일 통일도 앱으로 안 넘어간다. 반대로 "언제 무엇이 실패했고
      사용자에게 무엇을 말하나"는 훅·상태 축이라 SwiftUI에서도 같은 판단을 다시 쓴다.
      이 논리가 c4를 soft로, c5를 "이징 하나"로 묶는 근거다.
  - id: c9
    type: technical
    description: >-
      새 사용자 노출 문구는 docs/COPY_TONE_GUIDE.md를 따른다 — 실패·차단은 [무슨 일] +
      [다음 행동] 두 문장, 한 문장 33자 · 전체 44자 상한. 라벨에는 조건절·종결어미·마침표를
      쓰지 않는다.
    hard: true
    rationale: >-
      가이드 축 3·축 2. 상한은 현행 최댓값 추인이라(가이드:137-139) 넘기면 좁은 400px 프레임에서
      줄 수가 늘고, 넘기려면 상한을 먼저 다시 재야 한다. 기존 문구가 이미 상한선에 있다 —
      `저장에 실패했어요. 브라우저 저장 공간이 가득 찼거나 비공개 모드일 수 있어요.`가 44자 동률.
  - id: c10
    type: technical
    description: >-
      fixed 좌표는 PhoneFrame 기준으로 유지한다. ErrorToastHost는 MobileEditorShell 트리 안에
      한 번만 마운트한다.
    hard: true
    rationale: >-
      errorToast.tsx:82-83 주석 — fixed 좌표가 프레임의 contain:paint에 갇혀야 데스크톱에서도
      400px 프레임 밖으로 안 샌다(#609). c3이 좌표를 옮기는 작업이라 이 제약을 직접 건드린다.
      measure-chrome.mjs의 frameFit 축이 프레임 봉쇄를 재고, contain:paint를 지우면 fixed
      오버레이 3종이 좌 520px 넘치는 게 실측돼 있다(CLAUDE.md).

success_criteria:
  - id: ac1
    description: >-
      OCR 되돌리기 배너가 떠 있는 동안 셸 스낵바가 떠도 배너의 '되돌리기'·'확인' 두 버튼이
      가려지지 않는다.
    verifiable: true
    measurable_via: >-
      크롬 하네스 — 400×675에서 OCR 적용으로 배너를 띄운 뒤 전역 undo를 눌러 스낵바를 띄우고,
      두 요소의 getBoundingClientRect가 겹치지 않는지 대조. happy-dom엔 실 레이아웃이 없어
      rect를 못 재므로 유닛 테스트로는 못 잠근다 — 유닛 쪽은 두 좌표 클래스가 문자로 같지
      않은지만 대조하는 얕은 가드까지가 한계다.
  - id: ac2
    description: >-
      진단문서 8개 항목(C1·C2·C4·C5·M1·M6·M4·M5·m3)이 해소 상태로 유지된다 — 이번 작업이
      되돌리지 않는다.
    verifiable: true
    measurable_via: >-
      기존 테스트 유지 + 전수 grep 2종 — src에 `alert(`가 없고, 빈 catch가 index.tsx:64 ·
      _document.tsx:23 둘로만 남고(c6 뒤 :77도 소멸), 리터럴 `focus:` 0건.
  - id: ac3
    description: >-
      스프링 이징이 pressableVariants base가 아니라 `transition: 'cta'` variant에만 붙는다.
      base에 transition-property가 생기지 않는다.
    verifiable: true
    measurable_via: >-
      variants.ts를 읽는 단위 테스트 — pressableVariants()의 기본 반환 문자열에
      `transition-`이 없고, pressableVariants({transition:'cta'})에만 있는지 대조.
      variants.ts:6-11이 경고하는 회귀를 문자로 잠근다.
  - id: ac4
    description: >-
      추천색 추출이 실패하면 사용자에게 한 번 알린다. 성공 경로에는 아무 알림도 안 뜬다.
    verifiable: true
    measurable_via: >-
      index.tsx의 동적 import 경로를 mock해 reject시키고 ErrorToastHost에 문구가 뜨는지.
      mock.module 복원은 반드시 `const real = { ...require(p) }` 스프레드 스냅샷으로(#611).
  - id: ac5
    description: >-
      새 문구가 톤 가이드 상한(한 문장 33자 · 전체 44자)과 축 3 두 문장 구조를 지킨다.
    verifiable: true
    measurable_via: >-
      문구 상수에 대한 길이 단언. 기존 showError 호출 6곳의 문구가 이미 그 형태라 같은 틀을 쓴다.
  - id: ac6
    description: >-
      프레임 봉쇄가 유지된다 — 좌표를 옮긴 알림 표면이 400px 프레임 밖으로 안 샌다.
    verifiable: true
    measurable_via: >-
      scripts/measure-chrome.mjs의 frameFit 축. dock 290 / 프리뷰 190.9×305 불변식은 이 작업이
      안 건드리는 값이지만 같이 통과해야 한다.


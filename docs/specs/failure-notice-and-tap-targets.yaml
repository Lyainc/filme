  - id: c3
    type: technical
    description: >-
      OcrUndoBanner(z-50)와 셸 스낵바(z-[60])가 같은 `fixed bottom-6 left-1/2 -translate-x-1/2`
      좌표에 서지 않게 한다. 배너가 떠 있는 동안 스낵바가 배너의 두 버튼을 가리면 안 된다.

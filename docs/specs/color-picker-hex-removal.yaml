    직계 선행은 #678(컬러 패널 재설계 — 헥스를 전폭 행에서 인라인 w-[92px]로 줄인 그 작업,
    closed 2026-08-14)이고 이 스펙은 그 뒤를 잇는다: #678이 폭을 줄여 산 시간을 이번에 제거로
    끝낸다. #682(레일 슬롯 높이 17.5svh → min(214px,26svh))가 세로 예산 숫자의 출처고,
    #647(cva 도입 + 상태 스타일 강제)이 c5·c6의 자세와 파서 규칙을 세웠고, #701(영문 aria-label
    3종 → 한국어)이 '색상 코드'·'직접 지정'이라는 지금 이름을 만들었다 — c1이 그중 '색상 코드'를
    소멸시키므로 #701 표에서도 한 행이 빠진다(docs/COPY_TONE_GUIDE.md:195-197).
    #367(레일 상세패널 공통 문법 46px 칩 + 이중 링)이 c5가 모으려는 값들의 출처다.
    열린 9개 중 관련 후보는 #585(% 입력 포커스 시 소프트 키보드가 레일 dock을 덮는지 실기기
    확인) 하나인데 방향이 오히려 같다 — 헥스가 사라지면 컬러 패널에서 소프트 키보드를 부르는
    입력 자체가 없어져 그 축의 표면이 줄어든다. #706(hover에만 사는 정보 4곳)은 title 속성
    축이라 직교하지만, 스와치의 title={s.label}이 그 목록에 들어 있었는지는 확인하지 않았다.
    한계: 검색은 키워드 9종(컬러·헥스·색상·radiogroup·접근성·토스트·알림·좌석·탭타깃)으로
    돌렸고 닫힌 369개 본문은 안 봤다. 용어가 안 겹치는 충돌 이슈는 prefilter에 안 올라온다.

blindspots:
  - area: blind-spots
    question: >-
      네이티브 피커에서 hex에 닿는 비용이 얼마인가. 웹 검색으로 확인한 범위에선 전제가 선다 —
      iOS의 UIColorPickerViewController는 Sliders 탭에 RGB 슬라이더와 함께 hex 입력 필드를
      두고, 데스크톱 Chrome의 자체 피커에도 hex 입력이 있다. 다만 **iOS는 Grid 탭이 기본이라
      hex까지 탭 전환이 한 번 더 든다** — 지금은 패널에 항상 떠 있던 필드가 "피커 열기 → 탭
      전환 → 입력"이 되므로, 디자인 시안의 hex를 복붙하는 흐름은 확실히 느려진다. 오너가 그
      흐름을 실제로 쓰는지가 이 결정의 유일한 되돌림 조건이고, 실기기 확인은 안 했다.
  - area: blind-spots
    question: >-
      Android Chrome·삼성 인터넷·카카오/인스타 인앱 웹뷰의 color picker에도 hex 필드가 있는가.
      확인한 건 iOS와 데스크톱 Chrome뿐이다. 없는 브라우저가 있으면 그 환경에선 임의 색 지정이
      슬라이더로만 가능해져 ac5의 "지정할 수 있다"는 성립하되 정밀도가 떨어진다. 공유 링크로
      들어오는 경로가 있는 앱이라 인앱 웹뷰 비중이 낮지 않다.
  - area: blind-spots
    question: >-
      c3의 roving tabindex가 기존 테스트의 Tab 기반 순회를 깨는가. 세 픽커 중 LayoutStrip은
      designRail.test.tsx:119가 getByRole('radio', {name: /크라이테리언/})로 직접 클릭하므로
      영향이 없지만, 포커스 순서를 세는 테스트가 다른 파일에 있는지는 전수로 안 봤다.
      radiogroup이 Tab을 하나만 받게 되면 그룹 안 항목 수만큼 있던 탭 스톱이 1개로 줄어든다.
  - area: blind-spots
    question: >-
      c7로 색 면적을 46px 전체로 넓히면 흰색 스와치(#FFFFFF)와 라이트 테마 배경의 경계가
      c8의 헤어라인에만 의존하게 된다. 지금은 28px span이라 칩 테두리(border-line)가 경계를
      한 겹 더 대주는데, 색이 테두리까지 꽉 차면 그 여벌이 사라진다. c7과 c8은 따로 판단할
      수 있는 항목처럼 보이지만 실은 c7이 c8을 필수로 만든다.


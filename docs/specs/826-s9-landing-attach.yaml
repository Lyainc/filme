  - id: constraint-8
    type: technical
    description: "첨부 시트: '티켓 스크린샷으로 자동입력'을 누르면 파일 선택이 아니라 시트가 열린다. 시트는 role=dialog · aria-modal · 제목 '티켓과 포스터' · 닫기 버튼(aria-label '닫기') · Escape 닫기 · Tab 순환 · 닫으면 주 버튼으로 포커스 복귀(APG Dialog)다. 시트는 아래에 붙고 위 모서리만 --pr-r-sheet로 둥글며, 뒤의 큰 티켓이 보이도록 화면을 어둡게 덮지 않는다(시트 밖 탭은 닫기). 안에 두 행 버튼 — '티켓 스크린샷'(누르면 OCR 카드의 같은 파일 입력이 열린다, 상태: 인식 중 · 인식했어요 · 실패 문구) · '포스터'(누르면 포스터 입력 → 크롭 모달, 상태: 비면 '선택' · 넣으면 썸네일) — 과 주 버튼 '만들기'가 있다. 이미 넣은 행을 다시 누르면 바꾼다. '만들기'는 하나 이상 넣었고 인식 중이 아닐 때만 활성이다(비활성은 aria-disabled + 보조 모양)."
    hard: true
    rationale: "D24 피드백 2(티켓 스크린샷 · 포스터를 한 모달에서 한 번에), D25 시트 그림, APG Dialog(CLAUDE.md UI 패턴 레퍼런스)."
  - id: constraint-9
    type: technical
    description: "문서 수명(스냅샷, 소유자 결정 2026-11-24): 시트에서 첫 파일을 고르는 순간(스크린샷이면 파일 선택 직후 인식 시작 전, 포스터면 크롭 확정 직후) 지금 메모리 문서 · 실행 취소 기록 · OCR 되돌리기 상태를 스냅샷으로 뜨고 자동저장을 보류한 뒤 고른 무드로 새 문서를 시작한다. 이 새 문서가 시작될 때 이전 문서의 blob URL(포스터 · 로고 · 서명 · 배경 이미지)은 해제하지 않고 미룬다. 시트를 닫으면(닫기 · Escape · 시트 밖 탭) 새 문서의 blob을 해제하고 스냅샷으로 되돌리며, 진행 중이던 OCR 응답 · KOBIS 보강 · IndexedDB 복원은 늦게 도착해도 버린다. 저장분(localStorage · IndexedDB)은 시트가 열린 동안 한 번도 써지지 않는다. '만들기'를 누르면 미뤄 둔 이전 문서 blob을 해제하고 자동저장 보류를 풀어(새 문서가 편집됐으면 곧 저장) 랜딩을 걷는다 — 스크린샷으로 채웠으면 디자인 모드 + 자동입력 배너(E-05), 아니면 정보 모드. 시트를 열고 아무것도 안 넣고 닫으면 아무 일도 없다."
    hard: true
    rationale: "소유자 답 '스냅샷 방식 (Recommended)'. #727 c7(저장분은 새 문서의 첫 자동저장에야 덮인다)을 시트에서도 지키고, 닫기를 '아무것도 안 바뀜'으로 만든다. #793 · #806 최신성 판정과 같은 세대 비교로 늦은 응답을 버린다."
  - id: constraint-10
    type: technical
    description: "실시간 반영(D25 아이디어 2): 스냅샷이 시작된 뒤 시트가 열린 동안 전시 가운데 카드 자리에는 정적 견본 대신 지금 문서를 TicketRenderer로 그린 티켓이 고른 무드로 선다(포스터를 넣으면 포스터, 인식이 끝나면 제목 등 채워진 필드가 바로 보인다). 시트가 열린 동안 좌우 카드는 숨고 가운데 티켓은 시트 위 남은 높이에 맞춰 줄어든다. 스냅샷 전(아무것도 안 넣음)에는 정적 견본 그대로다. 실시간 티켓은 TicketRenderer 한 벌만 마운트한다."
    hard: true
    rationale: "D25-12 그림 '고른 무드에 내 티켓이 차오름'."
  - id: constraint-11
    type: technical
    description: "인식 안내 자리: 시트에서 연 인식의 진행 · 오류 문구(S5 constraint-11의 여덟 문구, 문구 그대로)는 시트의 '티켓 스크린샷' 행 상태 줄에 뜬다(오류는 --pr-warn 계열). 상시 마운트 role=status 리전은 유지한다. 편집 화면에서 연 인식은 지금처럼 셸 notify다. 랜딩 전시 아래 안내 자리(LandingNotice)는 시트 밖에서 인식이 열릴 일이 없으므로 걷는다."
    hard: true
    rationale: "인식은 이제 시트에서만 열리므로 안내도 그 행에 붙는 게 가깝다(L-03 '주 CTA 바로 위' 원칙의 시트판)."
  - id: constraint-12
    type: technical
    description: "이용 고지(소유자 결정 2026-11-24 '작은 시트로 열기'): 워드마크 줄의 '이용 고지'를 누르면 지금 고지 문구 · 크레딧 · GitHub 링크(문구 그대로)가 아래에서 뜨는 작은 시트(role=dialog · 닫기 버튼 · Escape)에 보인다. 랜딩 배치는 흔들리지 않는다. 편집 화면에는 지금처럼 고지가 없다(appFooterNotice 부재 단언 유지). 랜딩에 '비공식 팬메이드 도구' 같은 설명 문장은 없다."
    hard: true
    rationale: "D24 피드백 3(불필요한 설명 제거), D25 공통 3, #363 · #614(고지는 랜딩에서 사라지면 안 됨)."
  - id: constraint-13
    type: technical
    description: "문구: 헤드라인 '티켓 한 장이, 내 굿즈가 돼요' · 서브 '스크린샷으로 자동입력. 사진으로 찍은 실물 티켓도 돼요.' · 링크 쌍 '포스터 업로드' · '포스터 없이 직접 입력'을 랜딩에서 걷고 '직접 입력' · '티켓과 포스터' · '티켓 스크린샷' · '포스터' · '선택' · '인식 중' · '인식했어요' · '만들기' · '닫기'를 새로 쓴다(COPY_TONE_GUIDE 축 1 · 2 판별 통과). '티켓 스크린샷으로 자동입력'은 그대로다. 이 문자열을 쓰던 테스트는 같은 동작을 새 문구로 단언하도록 고치고, docs/COPY_TONE_GUIDE.md 잠금 표 · CLAUDE.md 🚧 '일부러 남긴 것'의 링크 쌍 문장 · 랜딩 주석을 새 사실로 고친다. 티켓 렌더 안의 문구(moods/_shared.tsx)는 범위 밖이다."
    hard: true
    rationale: "D23 · D24 결정(경로 좁히기 · 헤드라인 삭제). 잠긴 문구는 소유자 결정으로만 바뀐다(COPY_TONE_GUIDE '문구를 실제로 바꿀 때')."
  - id: constraint-14
    type: technical
    description: "하네스: prod 빌드에 bun scripts/measure-chrome.mjs --theme dark · --theme light가 exit 0이고 dock 249 / 프리뷰 219×350, 랜딩 · posterless · 프레임 봉쇄 축이 통과한다. 사라진 셀렉터(beam · landing-panel · 링크 쌍 · details 고지)에 기대던 축은 새 구조로 고치되 checked:false로 남기지 않고, 첨부 시트가 프레임 안인지 재는 축을 봉쇄 축에 더해 process.exitCode에 싣는다."
    hard: true
    rationale: "CLAUDE.md 📏(#609 · #714), docs/HARNESS.md 4 · 10 · 11절."
  - id: constraint-15
    type: technical
    description: "검증 경계: 헤드리스 Chrome · Aside · iOS Simulator 결과는 실기기 PASS가 아니고 실기기 검증은 S8 몫이다. Android 커버리지를 주장하지 않는다(#585)."
    hard: true
    rationale: "CLAUDE.md 🔬, 마스터 07-seeds S8."
  - id: constraint-16
    type: other
    description: "착수 · 작업 규칙: 이 Seed가 소유자 승인으로 active일 때 구현한다. 워크트리 .claude/worktrees/826-landing-d25 · 브랜치 feat/826-landing-d25(base main 0d7f2733), 검증된 단위마다 Conventional Commits로 커밋 · push하고 PR · 머지는 소유자 승인 없이 하지 않는다. 구현 중 Seed · 마스터 · 정책 · 다른 화면 · 기능 명세를 바꿔야 하면 정리해 소유자에게 묻는다(2026-11-24 지시)."
    hard: true
    rationale: "P1 · P21, CLAUDE.md Git 규약, 소유자 지시 2026-11-24."
  - id: constraint-17
    type: other
    description: "근거 원본: 캔버스 FILME 리뉴얼(https://claude.ai/artifact/4cvubgJpHC9ANQudDDoJ5F)의 D22 · D23 · D24 · D25(D25-12 채택), 선행 Seed docs/specs/826-s5-landing.yaml@0d7f2733(closed · completed — 이 Seed는 그 constraint-3 · 5 · 7 · 10 · 11 · 12를 바꾼 새 결정이다), 마스터 docs/826-page-master L-01~L-03."
    hard: true
    rationale: "seed-lifecycle '닫힌 부모의 범위'(새 독립 Seed, 부모 인용)."
  - id: constraint-18
    type: other
    description: "마스터 동기화: 구현과 같은 작업 안에서 origin/docs/826-page-master 30e2abf3에서 딴 자식 브랜치 docs/826-master-s9에 frames.js L-01 · L-02 · L-03과 랜딩 근거표(evidence/51-copy-changed · 50-copy-locked, data/trace.js)를 이 Seed 화면으로 고치고, 생성기(node tools/gen-canvas.js) exit 0과 MASTER_CHECK(393 · 375 × 라이트 · 다크, 실패 0)로 검증한다. 캔버스 재생성 · 게시와 마스터 PR · 머지는 이 Seed가 하지 않고 D21 마스터 세션의 묶음 단계가 소유자 승인 뒤 한다. frames.js의 NOTICE 상수는 결과 화면 result()도 쓰므로 문구를 바꾸지 않는다."
    hard: false
    rationale: "결정 · 비교판 규칙, 소유자 원칙 '마스터는 무조건 현황을 따라가게', 소유자 확정(2026-11-24, D21 마스터 세션 전달 '결정 필요한거 4개 모두 확정')."

success_criteria:
  - id: acceptance-1
    description: "bun run typecheck · bun run lint · bun run test가 모두 통과한다."
    verifiable: true
    measurable_via: "세 명령 종료 코드 0과 출력 요약"
  - id: acceptance-2
    description: "constraint-1 · 2: 착수 base 대비 moods/** · TicketRenderer · captureToImage · hero-*.webp diff 0줄, EditorDock · InPlaceFieldEditor · ImageCropModal · EditorMenu · ResultPanel · ResultStage · src/pages/t/** diff 0줄."
    verifiable: true
    measurable_via: "git diff --stat <base> -- 해당 경로"
  - id: acceptance-3
    description: "constraint-3 · 4: 랜딩에 h1 헤드라인 · 서브 · mood-gallery-beam · landing-exit-paths · details 고지가 없고, 워드마크 줄 안에 '이용 고지' 버튼이 있으며, 아래에 주 버튼 · '직접 입력' 두 버튼이 있다. 진행 막대가 aria-hidden이고 한 칸 넘길 때 지금 칸이 바뀐다. 헤드리스 400×675에서 가운데 카드 높이가 전시 높이의 0.85 이상이고 카드 rect가 프레임 안이며 좌우 카드와 가운데 카드 사이 간격이 16px 이상이다. 다크에서 좌우 카드 computed filter가 none이다. 착수 base 대비 랜딩 추가 줄에 gradient( · blur( · rounded-full · 9999px가 없다."
    verifiable: true
    measurable_via: "상호작용 테스트 + 헤드리스 측정 + git diff grep"
  - id: acceptance-4
    description: "constraint-4: S5 acceptance-4의 타이밍 단언이 그대로 통과하고, 첨부 시트 · 이용 고지 시트가 열린 동안 8000ms 넘어가지 않으며 닫으면 4000ms 뒤 넘어간다."
    verifiable: true
    measurable_via: "fake timer 상호작용 테스트"
  - id: acceptance-5
    description: "constraint-5 · 6: 좌우 카드를 탭하면 그 카드가 가운데(aria-pressed true)가 되고 랜딩은 그대로다. 가운데 카드를 탭해도 랜딩이 그대로다. 재단 표시가 가운데(격자면 고른) 카드에만 있다. 격자에서 카드를 탭하면 그 카드만 aria-pressed true다. 키보드 포커스로 다른 카드가 가운데에 온다."
    verifiable: true
    measurable_via: "상호작용 테스트(일반 · matchMedia reduce)"
  - id: acceptance-6
    description: "constraint-7: 크라이테리언을 가운데로 고르고 '직접 입력'을 누르면 layout이 criterion인 빈 새 문서로 편집 화면(정보 모드)이 열린다. 아무것도 안 고르면 첫 카드 무드다."
    verifiable: true
    measurable_via: "상호작용 테스트"
  - id: acceptance-7
    description: "constraint-8: 주 버튼을 누르면 파일 선택 대신 role=dialog '티켓과 포스터'가 열리고 포커스가 시트 안으로 들어가며, Escape · 닫기 · 시트 밖 탭으로 닫히고 포커스가 주 버튼으로 돌아온다. '티켓 스크린샷' 행이 OCR 파일 입력을, '포스터' 행이 포스터 입력을 연다. '만들기'는 아무것도 안 넣었을 때 · 인식 중에 aria-disabled이고 눌러도 아무 일이 없다."
    verifiable: true
    measurable_via: "상호작용 테스트(testing-library + user-event)"
  - id: acceptance-8
    description: "constraint-9: 저장분이 있는 상태에서 시트로 포스터를 넣고 닫으면 메모리 문서가 시트 전과 같고(제목 · 무드 · 포스터 URL) 이전 포스터 blob이 해제되지 않았으며 새 포스터 blob은 해제됐고, 그동안 localStorage 저장 키가 바뀌지 않는다. 스크린샷 인식 도중 닫으면 늦게 온 OCR 응답이 문서를 바꾸지 않는다. 포스터 · 스크린샷을 넣고 '만들기'를 누르면 랜딩이 걷히고 고른 무드 · 포스터 · 인식 결과가 든 문서로 디자인 모드와 자동입력 배너가 보이며, 이전 문서 blob이 해제되고 자동저장이 다시 걸린다. 아무것도 안 넣고 닫으면 문서 · 저장분 · 실행 취소 기록이 그대로다."
    verifiable: true
    measurable_via: "상호작용 테스트(URL.revokeObjectURL 스파이 · localStorage 스파이 · mock runOcr 지연 응답)"
  - id: acceptance-9
    description: "constraint-10: 스냅샷 시작 뒤 시트가 열린 동안 전시 가운데에 TicketRenderer 티켓이 하나 있고 그 layout이 고른 무드이며, 포스터를 넣으면 그 티켓 안 포스터 img src가 새 blob이고 인식 뒤 제목 글자가 보인다. 스냅샷 전에는 정적 견본 img다."
    verifiable: true
    measurable_via: "상호작용 테스트"
  - id: acceptance-10
    description: "constraint-11: 시트에서 연 인식의 여덟 안내 문구가 '티켓 스크린샷' 행 상태 줄에 뜨고(오류는 warn 클래스), role=status 리전에도 실린다. 편집 화면에서 연 인식은 notify 경로 그대로다(ocrFailureFlow · mobileEditorShellOcrEntryConsolidation 통과)."
    verifiable: true
    measurable_via: "상호작용 테스트"
  - id: acceptance-11
    description: "constraint-12: '이용 고지'를 누르면 role=dialog 안에 고지 문구 · 크레딧 · GitHub 링크가 보이고 닫힌다. appFooterNotice의 편집 화면 부재 단언이 통과한다."
    verifiable: true
    measurable_via: "상호작용 테스트"
  - id: acceptance-12
    description: "constraint-13: src에 '티켓 한 장이, 내 굿즈가 돼요' · '사진으로 찍은 실물 티켓도' · '포스터 없이 직접 입력' · 랜딩의 '포스터 업로드' 버튼이 없고(moods 제외), COPY_TONE_GUIDE 잠금 표 행별 테스트 목록이 git grep -l과 같으며, CLAUDE.md 🚧 문장이 새 사실이다."
    verifiable: true
    measurable_via: "git grep + 잠금 표 대조"
  - id: acceptance-13

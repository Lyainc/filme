<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>F 캔버스 + 문맥 패널</title><link rel="stylesheet" href="shared/base.css"><style>
.screen { --tw: 84cqi; --th: calc(var(--tw) * 1.598); }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.btn.sm { min-height: 44px; padding: 0 8px; font-size: 13px; flex: none; white-space: nowrap; }
.btn.sm.fg { color: var(--fg); }
/* 티켓 내부(절대 배치) */
.ticket .f { position: absolute; line-height: 1.2; }
.ticket .f.title { left: 6%; top: 65%; width: 88%; font-size: 7cqi; font-weight: 700; line-height: 1.1; }
.ticket .f.c { font-size: 4.2cqi; display: flex; flex-direction: column; white-space: nowrap; }
.ticket .f.c small { font-size: 3cqi; opacity: .55; }
.ticket .f.foot { left: 6%; top: 92%; font-size: 3.4cqi; opacity: .7; }
.ticket .f.logo { left: 6%; top: 3.2%; width: 24%; height: 4.2%; display: grid; place-items: center; font-size: 3.6cqi; font-weight: 700; color: #fff; border: 1px solid rgba(255,255,255,.7); border-radius: 3px; letter-spacing: .06em; }
.ticket .hit.posel { outline-offset: -3px; }

/* 상단 한 줄(C): ‹ · 실행 취소 · 다시 실행 · ⋯ · 완료 */
.tb { flex: none; height: 52px; display: flex; align-items: center; padding: 0 4px; min-width: 0; }
.tb .sp { flex: 1; min-width: 0; }
.tb .btn.done { padding: 0 16px; margin: 0 8px 0 2px; }
.tb.res .rt { font-size: 16px; flex: 1; text-align: center; }

/* 캔버스: 티켓은 남는 높이를 최대로 써요 */
.canvas { position: relative; flex: 1; min-height: 0; }
.canvas > .ticket { position: absolute; top: 8px; bottom: 8px; left: 50%; transform: translateX(-50%); }

/* 하단 패널 하나(A의 표면 + C의 대상 문법). 항상 있어요 */
.fp { position: relative; z-index: 5; flex: none; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0; box-shadow: 0 -8px 24px -14px rgba(0,0,0,.3); padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fp::before { content: ""; position: absolute; top: 6px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--line); }
.fp > .rq { top: -9px; }
.trail { flex: none; display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 2px; padding: 0 16px; height: 44px; scrollbar-width: none; }
.trail::-webkit-scrollbar, .rail::-webkit-scrollbar, .thumbs::-webkit-scrollbar { display: none; }
.tc { flex: none; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-size: 14px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; color: var(--fg); }
.tc[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.tc .rd { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
.ph { flex: none; height: 44px; display: flex; align-items: center; gap: 2px; min-width: 0; }
.ph b { font-size: 15px; margin-right: 4px; white-space: nowrap; }
.ph .gap { flex: 1; min-width: 0; }
.tog { min-height: 44px; border: 0; background: transparent; padding: 0 4px; display: inline-flex; align-items: center; flex: none; }
.tog .chip { min-height: 32px; }
.acts1 { flex: none; display: flex; align-items: center; gap: 8px; min-height: 44px; min-width: 0; }
.acts1 .btn { padding: 0 14px; flex: none; }
.acts1 .seg { flex: 1; min-width: 0; }
.acts1 .seg button { min-height: 38px; font-size: 13px; }
.fp > .seg { flex: none; }
.fp .seg button { min-height: 34px; font-size: 14px; padding: 0 2px; white-space: nowrap; }
.fp .slider { grid-template-columns: 5.4em 1fr 3ch; }
.fp .slider.one { grid-template-columns: 3em 1fr 3ch; }

/* 디자인 썸네일: 높이로 크기를 정해 라벨과 겹치지 않아요 */
.thumbs { flex: none; display: flex; gap: 6px; overflow-x: auto; margin: 2px -16px 0; padding: 0 16px; scrollbar-width: none; }
.thumb { flex: none; min-width: 72px; border: 2px solid transparent; background: transparent; border-radius: 10px; padding: 3px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--fg); }
.thumb[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.tbox { height: 36px; display: flex; align-items: center; justify-content: center; }
.tbox .ticket { width: auto; height: 100%; box-shadow: 0 2px 6px -2px rgba(0,0,0,.4); border-radius: 3px; }
.tbox .ticket.wide { aspect-ratio: 1534 / 960; }
.tbox .ticket .poster { bottom: 38%; }
.tl { font-size: 11px; line-height: 14px; white-space: nowrap; }

/* 펼친 패널 */
.fp.x { height: 340px; }
.pbody { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding-top: 2px; margin-right: -4px; padding-right: 4px; }
.srow { display: flex; align-items: center; gap: 8px; min-width: 0; flex: none; }
.srow .sl { font-size: 13px; width: 2.6em; flex: none; color: var(--fg-muted); }
.rail { display: flex; gap: 6px; overflow-x: auto; min-width: 0; flex: 1; scrollbar-width: none; }
.rail .chip { min-height: 44px; padding: 0 14px; flex: none; white-space: nowrap; }
.sh { font-size: 13px; color: var(--fg-muted); padding: 6px 0 0; flex: none; }

/* 필드 편집 · 키보드 */
.kbscreen .zoomvp { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.kbscreen .zt { position: absolute; left: 50%; width: var(--tw); margin-left: calc(var(--tw) / -2); bottom: calc(44px - var(--th) * .325); transform: translateX(14cqi) scale(1.6); transform-origin: 50% 67.5%; }
.fp.inp { padding-top: 8px; gap: 2px; box-shadow: 0 -8px 24px -12px rgba(0,0,0,.35); }
.fp.inp::before { display: none; }
.fp.inp label { font-size: 13px; color: var(--fg-muted); flex: none; }
.kobis { list-style: none; margin: 0; padding: 0; }
.kobis li { display: flex; align-items: center; gap: 10px; min-height: 48px; border-top: 1px solid var(--line); min-width: 0; }
.kobis .th { width: 28px; height: 38px; border-radius: 4px; background: var(--surface-2); flex: none; }
.kobis .kt { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.kobis .kt b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kobis .kt small { font-size: 12px; color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 결과 */
.rbody { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
.rwrap { position: relative; }
.saved { margin: 0; font-size: 12px; color: var(--fg-muted); }
.acts { flex: none; padding: 8px 16px 20px; display: flex; flex-direction: column; gap: 8px; }
.lrow { display: flex; align-items: center; gap: 8px; min-width: 0; }
.lrow .btn { flex: none; }
.lrow small { flex: 1; min-width: 0; font-size: 12px; color: var(--fg-muted); line-height: 1.3; }

/* 랜딩(C와 같은 전시 배경) */
.landing { --panel: 236px; }
.land { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.gallery { position: absolute; inset: 0; overflow: hidden; }
.slide { position: absolute; inset: 0; padding: 150px 0 var(--panel); display: flex; align-items: center; justify-content: center; transition: opacity .8s; }
.slide[data-active="false"] { opacity: 0; visibility: hidden; }
.slide .main .ticket { width: 52cqi; transform: rotate(-3deg); box-shadow: 0 18px 40px -14px rgba(0,0,0,.6); }
.slide .peek { position: absolute; top: 160px; opacity: .55; }
.slide .peek .ticket { width: 40cqi; }
.slide .peek.l { left: -14cqi; transform: rotate(-9deg); }
.slide .peek.r { right: -14cqi; transform: rotate(8deg); }
.pause { position: absolute; left: 12px; bottom: calc(var(--panel) + 8px); background: var(--surface); border: 1px solid var(--line); border-radius: 50%; width: 44px; height: 44px; font-size: 12px; z-index: 6; }
.scrim-top { position: absolute; left: 0; right: 0; top: 0; height: 150px; background: linear-gradient(var(--bg) 50%, transparent); pointer-events: none; }
.land-head { position: relative; z-index: 3; padding: 0 20px; pointer-events: none; }
.wordmark { height: 44px; display: flex; align-items: center; font-size: 24px; font-weight: 800; letter-spacing: -.03em; color: var(--accent); }
.copy { margin: 10px 0 2px; font-size: 22px; line-height: 1.25; letter-spacing: -.02em; }
.sub { margin: 0; font-size: 14px; color: var(--fg-muted); }
.lpanel { position: relative; z-index: 5; margin-top: auto; height: var(--panel); background: var(--bg); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 12px 16px 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.resume { min-height: 52px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; text-align: left; min-width: 0; }
.resume .rt { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.resume small { font-size: 11px; color: var(--fg-muted); }
.resume b { font-size: 15px; }
.pair { display: flex; align-items: center; justify-content: center; gap: 2px; font-size: 14px; color: var(--fg-faint); flex-wrap: wrap; }
.lnk { min-height: 44px; border: 0; background: transparent; padding: 0 6px; color: var(--accent); font-weight: 600; font-size: 14px; }
.legal { margin: 0; text-align: center; font-size: 11px; color: var(--fg-muted); }
@container (max-width: 340px) { .btn.sm { padding: 0 4px; } .tog { padding: 0 2px; } .tc { padding: 0 12px; } }
</style></head>

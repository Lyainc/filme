.screen{--pad:12px}
.sp{flex:1}

.st+.st::before{content:"";position:absolute;top:16px;height:2px;left:-50%;right:50%;background:var(--line)}
.st.done::before,.st.cur::before{background:var(--accent)}
.st .dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:11px;font-weight:700;display:grid;place-items:center;position:relative;z-index:1}
.st.done .dot{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.st.cur .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.st.cur{color:var(--fg);font-weight:700}
.st .warn{position:absolute;top:4px;left:calc(50% + 7px);width:10px;height:10px;border-radius:50%;background:var(--warn);border:2px solid var(--bg);z-index:2}
@container (max-width:350px){.st{font-size:10.5px}}
.subrow{flex:none;min-height:48px;display:flex;align-items:center;gap:8px;padding:0 4px 0 var(--pad);font-size:13px;color:var(--fg-muted)}
.subrow .sl{flex:1;min-width:0}
.subrow .sl.warn{color:var(--warn);font-weight:600;font-size:12.5px;line-height:1.3}

.showall{min-height:36px;padding:0 10px;font-size:13px;flex:none}
.body{flex:1;min-height:0;overflow:auto;padding:4px var(--pad) var(--pad);display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;min-width:0}
.crow{display:flex;align-items:center;gap:10px}
.crow .ct{flex:1;min-width:0;display:flex;flex-direction:column}
.crow small{color:var(--fg-muted);font-size:12px}
.ci{width:40px;height:40px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:none}.ci svg{width:22px;height:22px}
.ocrh{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.two{display:flex;gap:6px;flex:none}.two .btn{padding:0 12px}

.band{position:relative;height:120px;overflow:hidden;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer}
.band-hint{position:absolute;right:8px;bottom:8px;display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 6px}

.list{flex:1;min-height:0;overflow:auto;padding:4px var(--pad) 12px}
.gh{font-size:12px;font-weight:700;color:var(--fg-muted);padding:12px 2px 6px;letter-spacing:.02em}

.frow.hasfont{grid-template-columns:minmax(0,1fr) auto 44px}
.fontbtn{min-height:44px;padding:0 10px;font-size:13px}
.vis svg{width:22px;height:22px}.vis.off{color:var(--fg-faint)}
.field.miss input{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--surface))}
.field.focus label{color:var(--accent);font-weight:600}
.list.kb{padding-top:8px}
.chiprow{flex:none;display:flex;gap:6px;overflow-x:auto;padding:6px var(--pad);border-top:1px solid var(--line);scrollbar-width:none}
.chiprow .chip,.rail .chip{min-height:40px;flex:none;padding:0 14px}
.chip[aria-disabled="true"]{opacity:.45}

.prow{display:flex;align-items:center;gap:10px}.pl{width:44px;font-size:13px;color:var(--fg-muted);flex:none}
.rail{display:flex;gap:6px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:none;padding:2px 0}
.panel .slider{grid-template-columns:64px 1fr auto}
.tstage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--surface-2)}
.tstage.big{background:var(--bg)}

.sw.on{background:var(--accent);border-color:var(--accent)}.sw.on .knob{left:22px}
.subrow .sp{flex:1}
.topbar{flex:none;height:52px;display:flex;align-items:center;padding:0 4px;gap:4px}.topbar b{flex:1;text-align:center}.topbar .sp{width:44px;flex:none}

.rbody{flex:none;padding:10px var(--pad) 22px;display:flex;flex-direction:column;gap:8px}
.btn.big{min-height:52px;font-size:16px}
.lrow{display:flex;gap:8px;align-items:flex-end}.lrow .field{flex:1}
.exp{margin:-2px 0 0;font-size:12px;color:var(--fg-muted)}
.btn svg{width:18px;height:18px}

.copy{flex:none;margin:0 0 8px;text-align:center;font-size:14px;color:var(--fg-muted)}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center}
.slides{flex:1;min-height:0;width:100%;position:relative}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:opacity .4s}
.slide[data-active="false"]{opacity:0;pointer-events:none}
.slide .cap{font-size:12px;color:var(--fg-muted);line-height:18px}
.tg{border:1px solid var(--line);background:var(--surface);border-radius:22px;font-size:12px;position:relative}
.lpad{flex:none;padding:8px var(--pad) 14px;display:flex;flex-direction:column;gap:8px}
.restore{display:flex;align-items:center;gap:8px;text-align:left;min-height:56px}

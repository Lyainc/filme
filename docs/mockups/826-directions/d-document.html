.bar{flex:none;height:48px;display:flex;align-items:center;gap:4px;padding:0 4px 0 2px}

.pv.col .th{width:45px;flex:none}
.pv.col .th .ticket{width:45px;border-radius:3px}
.pv.col .th .ticket .meta{display:none}
.pv.col .who{flex:1;min-width:0;display:flex;flex-direction:column}
.pv.col .who b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv.col .who small{color:var(--fg-muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{flex:1;min-height:0;overflow-y:auto;padding:0 16px 28px;overscroll-behavior:contain}
.gh{font-size:12px;font-weight:600;color:var(--fg-muted);padding:18px 6px 6px}
.grp{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.lr{position:relative;display:flex;align-items:center;gap:8px;min-height:48px;padding:0 0 0 14px;border-top:1px solid var(--line);min-width:0}
.lr:first-child{border-top:0;border-radius:14px 14px 0 0}
.lr:last-child{border-radius:0 0 14px 14px}
.lr:only-child{border-radius:14px}
.lr .lb{flex:none;max-width:48%;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .vl{flex:1;min-width:0;text-align:right;color:var(--fg-muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .chev{color:var(--fg-faint);font-size:20px;line-height:1}
.lr .pad{width:14px;flex:none}
.lr.hl{background:var(--accent-soft)}

.lr.rail{overflow-x:auto;padding:8px 10px;gap:10px;align-items:center}

.grp.blk{padding:12px 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.brand{flex:none;text-align:center;font-size:26px;font-weight:800;letter-spacing:-.03em;padding:6px 0 4px}
.car{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;display:grid;place-items:center}
.slide{grid-area:1/1;width:100%;display:flex;justify-content:center;transition:opacity .4s}

.carbar{flex:none;display:flex;align-items:center;gap:8px}
.hl{flex:1;min-width:0;margin:0;text-align:center;font-weight:700;font-size:15px;padding-left:44px}
.pw{position:relative;flex:none}
.cta{flex:none;display:flex;flex-direction:column;gap:10px;padding-top:6px}

.fine{margin:0;text-align:center;font-size:11px;color:var(--fg-faint)}

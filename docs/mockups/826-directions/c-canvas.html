<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>C 캔버스 직접 조작</title><link rel="stylesheet" href="shared/base.css"><style>
.screen { --tw: 84cqi; --th: calc(var(--tw) * 1.598); }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.btn.sm { min-height: 44px; padding: 0 10px; font-size: 14px; }
/* 티켓 내부(절대 배치) */
.ticket .f { position: absolute; line-height: 1.2; }
.ticket .f.title { left: 6%; top: 65%; width: 88%; font-size: 7cqi; font-weight: 700; line-height: 1.1; }
.ticket .f.c { font-size: 4.2cqi; display: flex; flex-direction: column; white-space: nowrap; }
.ticket .f.c small { font-size: 3cqi; opacity: .55; }
.ticket .f.foot { left: 6%; top: 92%; font-size: 3.4cqi; opacity: .7; }
.ticket .f.logo { left: 6%; top: 3.2%; width: 24%; height: 4.2%; display: grid; place-items: center; font-size: 3.6cqi; font-weight: 700; color: #fff; border: 1px solid rgba(255,255,255,.7); border-radius: 3px; letter-spacing: .06em; }
.ticket .f.ph { left: 0; right: 0; top: 24%; text-align: center; font-size: 5cqi; color: #6B645B; }
.ticket .f.ghost { outline: 1.5px dashed rgba(30,27,24,.45); outline-offset: 2px; border-radius: 3px; }
.ticket .f.ghost.c { min-width: 20%; min-height: 4.4%; }
.ticket .f.ghost.c span::before { content: "\00a0"; }
.ticket .f.title.ghost { width: 40%; height: 6%; color: rgba(30,27,24,.45); font-weight: 500; }
.ticket .hit.posel { outline-offset: -3px; }

/* 편집 골격: 상단 한 줄 + 캔버스 + 하단 한 줄 */
.tb { flex: none; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 4px; min-width: 0; }
.tb .btn.list { padding: 0 8px; min-width: 44px; gap: 4px; font-size: 14px; }
.tb .btn.done { padding: 0 14px; margin-left: 2px; }
@container (max-width: 350px) { .tb .lbl { display: none; } }
.canvas { position: relative; flex: 1; min-height: 0; }
.canvas > .ticket { width: var(--tw); margin: 8px auto 0; }
.ghostchip { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); min-height: 36px; padding: 0 14px; }
.br { flex: none; height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-top: 1px solid var(--line); background: var(--bg); min-width: 0; }
.br .deco { background: var(--surface); }
.br .hint { font-size: 12px; color: var(--fg-muted); min-width: 0; flex: 1; }

/* 문맥 툴바: 선택 옆에 떠요 */
.ftool, .ptool { position: absolute; z-index: 10; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.ftool { left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 0; padding: 4px; max-width: calc(100% - 12px); }
.ftool::after { content: ""; position: absolute; left: 22%; bottom: -6px; width: 10px; height: 10px; background: var(--surface); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); }
.tbtn { min-height: 44px; min-width: 44px; border: 0; background: transparent; border-radius: 10px; padding: 0 9px; font-size: 13px; font-weight: 600; display: inline-grid; place-items: center; white-space: nowrap; flex: none; }
.tbtn.ico svg { width: 20px; height: 20px; }
.ftool .sep { width: 1px; height: 24px; background: var(--line); margin: 0 2px; flex: none; }
.ptool { left: 8px; right: 8px; padding: 4px 10px 4px 6px; display: flex; flex-direction: column; gap: 0; }
.ptool::before { content: ""; position: absolute; left: 22%; top: -6px; width: 10px; height: 10px; background: var(--surface); border-left: 1px solid var(--line); border-top: 1px solid var(--line); transform: rotate(45deg); }
.ptool .r1 { display: flex; align-items: center; gap: 2px; min-width: 0; }
.ptool .seg { flex: 1; min-width: 0; }
.ptool .seg button { min-height: 38px; font-size: 13px; padding: 0 4px; }
.ptool .slider { padding-left: 6px; }

/* 첫 제안 카드 */
.suggest { position: absolute; z-index: 10; left: 50%; transform: translateX(-50%); top: calc(8px + var(--th)*.27); width: calc(var(--tw) - 36px); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.suggest b { font-size: 13px; color: var(--fg-muted); }

/* 꾸미기 시트 */
.canvas.small { display: block; flex: none; height: 334px; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 350px; background: var(--surface); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0; box-shadow: 0 -10px 30px -12px rgba(0,0,0,.35); padding: 0 12px 12px; display: flex; flex-direction: column; min-width: 0; }
.sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 4px; flex: none; }
.tabs { display: flex; gap: 2px; flex: none; overflow-x: auto; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; min-width: 56px; min-height: 44px; border: 0; background: transparent; font-size: 14px; color: var(--fg-muted); border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--accent); font-weight: 700; border-bottom-color: var(--accent); }
.sbody { flex: 1; min-height: 0; overflow-y: auto; padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.srow { display: flex; align-items: center; gap: 10px; min-width: 0; }
.srow .sl { font-size: 13px; width: 3ch; white-space: nowrap; flex: none; }
.rail { display: flex; gap: 6px; overflow-x: auto; min-width: 0; flex: 1; padding: 2px 0; }
.rail .chip { min-height: 40px; padding: 0 14px; flex: none; }
.sheet .seg button { min-height: 40px; }
.sheet .slider span:first-child { width: 3ch; }

/* 필드 편집 · 키보드 */
.kbscreen .zoomvp { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.kbscreen .zt { position: absolute; left: 50%; width: var(--tw); margin-left: calc(var(--tw) / -2); bottom: calc(44px - var(--th) * .325); transform: translateX(14cqi) scale(1.6); transform-origin: 50% 67.5%; }
.isheet { position: relative; flex: none; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -8px 24px -12px rgba(0,0,0,.35); padding: 4px 12px 8px; display: flex; flex-direction: column; gap: 4px; z-index: 5; }
.ih { display: flex; align-items: center; min-width: 0; }
.ih label { flex: 1; font-size: 13px; color: var(--fg-muted); min-width: 0; }
.ih .btn { padding: 0 8px; flex: none; }
.kobis { list-style: none; margin: 0; padding: 0; }
.kobis li { display: flex; align-items: center; gap: 10px; min-height: 48px; border-top: 1px solid var(--line); min-width: 0; }
.kobis .th { width: 28px; height: 38px; border-radius: 4px; background: var(--surface-2); flex: none; }
.kobis .kt { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.kobis .kt b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kobis .kt small { font-size: 12px; color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 결과 */
.tb.res .rt { font-size: 16px; }
.rbody { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
.rwrap { position: relative; }
.saved { margin: 0; font-size: 12px; color: var(--fg-muted); }
.acts { flex: none; padding: 8px 16px 20px; display: flex; flex-direction: column; gap: 8px; }
.acts .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* 랜딩 */
.landing { --panel: 236px; }
.land { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.gallery { position: absolute; inset: 0; overflow: hidden; }
.slide { position: absolute; inset: 0; padding: 150px 0 var(--panel); display: flex; align-items: center; justify-content: center; transition: opacity .8s; }
.slide[data-active="false"] { opacity: 0; visibility: hidden; }
.slide .main .ticket { width: 52cqi; transform: rotate(-3deg); box-shadow: 0 18px 40px -14px rgba(0,0,0,.6); }
.slide .peek { position: absolute; top: 160px; opacity: .55; }
.slide .peek .ticket { width: 40cqi; }
.slide .peek.l { left: -14cqi; transform: rotate(-9deg); }
.slide .peek.r { right: -14cqi; transform: rotate(8deg); }
.pause { position: absolute; left: 12px; bottom: calc(var(--panel) + 8px); background: var(--surface); border: 1px solid var(--line); border-radius: 50%; width: 44px; height: 44px; font-size: 12px; z-index: 6; }
.scrim-top { position: absolute; left: 0; right: 0; top: 0; height: 150px; background: linear-gradient(var(--bg) 50%, transparent); pointer-events: none; }
.land-head { position: relative; z-index: 3; padding: 0 20px; pointer-events: none; }
.wordmark { height: 44px; display: flex; align-items: center; font-size: 24px; font-weight: 800; letter-spacing: -.03em; color: var(--accent); }
.copy { margin: 10px 0 2px; font-size: 22px; line-height: 1.25; letter-spacing: -.02em; }
.sub { margin: 0; font-size: 14px; color: var(--fg-muted); }
.panel { position: relative; z-index: 5; margin-top: auto; height: var(--panel); background: var(--bg); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 12px 16px 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.resume { min-height: 52px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; text-align: left; min-width: 0; }
.resume .rt { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.resume small { font-size: 11px; color: var(--fg-muted); }
.resume b { font-size: 15px; }
.pair { display: flex; align-items: center; justify-content: center; gap: 2px; font-size: 14px; color: var(--fg-faint); flex-wrap: wrap; }
.lnk { min-height: 44px; border: 0; background: transparent; padding: 0 6px; color: var(--accent); font-weight: 600; font-size: 14px; }
.legal { margin: 0; text-align: center; font-size: 11px; color: var(--fg-muted); }
</style></head>

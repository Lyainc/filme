.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

<script>renderDirection('a');
document.querySelectorAll('.sw').forEach(function(b){b.addEventListener('click',function(){b.setAttribute('aria-checked',String(b.getAttribute('aria-checked')!=='true'));});});
document.querySelectorAll('.seg,.chips').forEach(function(g){g.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;g.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);});});});
document.querySelectorAll('.thumbs').forEach(function(g){g.addEventListener('click',function(e){var b=e.target.closest('.thumb');if(!b)return;g.querySelectorAll('.thumb').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});});});

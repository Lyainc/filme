name: CI

# 결정적 correctness 게이트. `claude-review`(비결정적, 판단 축)와 역할이 갈린다 — #593.
#
# paths 필터를 넣지 마라. required check가 path 필터로 스킵되면 GitHub에 상태를
# 리포트하지 않아 PR이 영구 pending으로 막힌다.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

  # push: main은 **관측용이고 차단 수단이 아니다.**
  # 이 레포는 rebase merge라 main에 올라간 최종 커밋 조합은 PR 시점 CI가 검증한 것과
  # 다르다(리베이스 결과에 대해 pull_request run은 다시 돌지 않는다). 게다가 main 머지가
  # 곧 Vercel prod 배포이므로 이 run이 빨간불이 되는 시점엔 이미 배포가 나간 뒤다.
  # 즉 여기서 얻는 건 "리베이스 조합이 깨진 순간을 배포 후에 보이게" 하는 것뿐이고,
  # 이걸 막고 싶으면 required_status_checks.strict를 켜야 하는데 #593이 그 대가
  # (머지 하나가 열린 PR 전부의 체크를 무효화 → 하루 6머지에서 재검증 연쇄)를 이유로
  # strict: false를 택했다.
  push:
    branches: [main]

jobs:
  ci:
    name: CI
    # **ubuntu가 아니라 macOS다.** ubuntu-latest 첫 run(30513451842)에서 941개 중 42개가
    # 깨졌는데 같은 커밋이 macOS에선 941 pass였다 — CI 파일 실행 순서를 그대로 로컬에서
    # 재생해도 통과했으니 순서 의존(`mock.module` 전역 누수)이 아니라 환경 차이다. 깨진
    # 42개는 두 갈래였다: ① testing-library 기본 async 타임아웃 1000ms에 정확히 걸린
    # 상호작용 테스트 24개(러너가 5배 느렸다 — 186.9s vs 로컬 36.2s), ② 캡처 픽셀
    # 등가 검사 14개 + `canShareTicketFile`의 `File` 프로브 등 플랫폼 결합 4개.
    # ②는 제품 버그가 아니라 테스트가 환경에 묶인 것이고, 풀려면 별건이 필요하다(#603).
    # 이 레포는 PUBLIC이라 macOS 러너 분당 과금이 없으므로, 개발자가 로컬에서 보는 것과
    # 같은 판정을 내는 쪽을 택했다. ubuntu로 되돌릴 땐 #611을 먼저 닫을 것.
    #
    # **이 선택은 PUBLIC에만 무료다.** private으로 전환하면 macOS는 분당 10배로 계산돼
    # (4분 job → 40분) 월 180 PR 규모에서 무시할 수 없다. 그때의 순서는 ① #611을 닫고
    # ubuntu로 복귀, ② 급하면 ubuntu + 그 18개만 플랫폼 가드로 스킵, ③ macOS 유지 시
    # 최소한 `push: main` 트리거를 빼서 run 수를 절반으로. 아래 `asyncUtilTimeout` 관련
    # 변경(happydom.ts)은 환경 무관한 개선이라 어느 쪽으로 가든 유지한다.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # package.json의 packageManager와 같은 버전으로 고정.
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      # __tests__/에 process.env 참조가 없어 시크릿 없이 통과한다 (#593 실측).
      # --timeout은 bun 기본 5000ms를 올린 것 — happydom setup이 testing-library의
      # asyncUtilTimeout을 5000ms로 올려서, 그대로 두면 테스트 캡이 그보다 먼저 걸린다.
      - run: bun test --timeout 30000

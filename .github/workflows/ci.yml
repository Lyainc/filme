name: CI

# 결정적 correctness 게이트. `claude-review`(비결정적, 판단 축)와 역할이 갈린다 — #593.
#
# paths 필터를 넣지 마라. required check가 path 필터로 스킵되면 GitHub에 상태를
# 리포트하지 않아 PR이 영구 pending으로 막힌다.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

  # push: main은 **관측용이고 차단 수단이 아니다.**
  # 이 레포는 rebase merge라 main에 올라간 최종 커밋 조합은 PR 시점 CI가 검증한 것과
  # 다르다(리베이스 결과에 대해 pull_request run은 다시 돌지 않는다). 게다가 main 머지가
  # 곧 Vercel prod 배포이므로 이 run이 빨간불이 되는 시점엔 이미 배포가 나간 뒤다.
  # 즉 여기서 얻는 건 "리베이스 조합이 깨진 순간을 배포 후에 보이게" 하는 것뿐이고,
  # 이걸 막고 싶으면 required_status_checks.strict를 켜야 하는데 #593이 그 대가
  # (머지 하나가 열린 PR 전부의 체크를 무효화 → 하루 6머지에서 재검증 연쇄)를 이유로
  # strict: false를 택했다.
  push:
    branches: [main]

  # PR 없이 브랜치에서 이 게이트를 한 번 돌려보기 위한 문. 트리거만 추가하고 하는 일은 같다.
  workflow_dispatch:

jobs:
  ci:
    name: CI
    # #593은 ubuntu 첫 run(30513451842)에서 941개 중 42개가 깨져 macOS로 피신했었다. 그때 42개를
    # "느린 러너 타임아웃 24 + 환경 결합 18"로 가른 진단이 틀렸다 — 순서 재생 실험이 무효였기
    # 때문이다: **bun test는 인자로 준 파일 순서를 따르지 않는다**(실측 2026-07-30). 그래서
    # "CI 순서를 로컬에서 재생했는데 통과"는 순서 의존을 배제하지 못한다.
    #
    # 실제로는 42개가 전부 프로세스 전역 mock 누수였다(#611). 깨진 파일들을 Linux에서 단독
    # 실행하면 그대로 통과한다. 누수는 두 겹이었다 — `mock.module` 복원이 살아있는 네임스페이스를
    # 되돌려 no-op이었던 것, 그리고 그 mock 가로채기가 캡처 테스트의 모듈 격리(`require.cache`
    # 우회)를 무력화한 것. macOS가 멀쩡했던 건 파일 실행 순서가 달라 피해자가 누수원보다 먼저
    # 돌았기 때문이다. 스킵·플랫폼 가드 없이 누수만 막아 945 pass가 됐다.
    #
    # #593이 넣은 happydom.ts의 `asyncUtilTimeout: 5000`은 유지한다 — 오진의 산물이 아니라 러너가
    # 실제로 느린 것에 대한 헤드룸이고, 아래 `--timeout 30000`이 그 값과 짝이다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # package.json의 packageManager와 같은 버전으로 고정.
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      # __tests__/에 process.env 참조가 없어 시크릿 없이 통과한다 (#593 실측).
      # --timeout은 bun 기본 5000ms를 올린 것 — happydom setup이 testing-library의
      # asyncUtilTimeout을 5000ms로 올려서, 그대로 두면 테스트 캡이 그보다 먼저 걸린다.
      - run: bun test --timeout 30000

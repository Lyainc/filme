name: Auto Release

# WHEN to cut a release, and DOES it. (claude-kit(Lyainc/claude-kit)의 auto-release.yml +
# release.yml을 선례로 삼되 FILME은 lockstep 버전 파일이 없어(#595: package.json version은
# 안 올린다, private:true) 두 파일로 안 쪼갠다 — bump 커밋이 없으니 release 잡을 워크플로
# 재실행 대상도 없다. 정책은 scripts/next-version.mjs가 실행하고, 여기는 배선뿐이다.
#
#   - 머지된 PR에 `release` 라벨 -> 지금 릴리즈, 버전은 커밋에서 계산.
#   - 미릴리즈 user-visible 커밋(feat/fix/perf/refactor/breaking) >= 70 -> 라벨 없어도
#     릴리즈. docs/chore/test/ci/build/style은 절대 트리거하지 않고 다음 릴리즈에 실려간다.
#
# 루프 안전: 이 워크플로는 main에 커밋을 push하지 않는다(태그 push + gh release create뿐)
# 이므로 자신을 재트리거하지 않는다 — claude-kit의 release.yml이 겪던 "bump 커밋이 push
# 트리거를 다시 깨우는" 문제 자체가 FILME엔 없다. concurrency 그룹은 라벨 트리거와 백스톱
# 트리거가 같은 순간 겹칠 때만을 위한 방어.

on:
  pull_request:
    # `closed`는 머지 시점에 라벨이 이미 있던 흔한 경우를 잡는다. `labeled`는 머지 *후*
    # 라벨이 붙는 경우(claude-kit #493과 동일 사유) — GitHub은 이미 closed된 PR에 라벨이
    # 바뀌어도 closed를 재발화하지 않는다. 아래 if의 조건(merged==true + release 라벨)이
    # 두 이벤트 모두에서 동일하게 성립한다.
    types: [closed, labeled]
    # BASE 브랜치 필터 — load-bearing. 체인 PR이 feature 브랜치로 머지되면서 release
    # 라벨을 달고 있어도, 이 필터가 없으면 그 이벤트로 main이 릴리즈된다(스크립트가 항상
    # main 기준으로 판정하므로, PR과 무관한 걸 릴리즈해버린다). 잘못 찍힌 태그+릴리즈는
    # 되돌리기 싸지 않다.
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  decide:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request 이벤트의 기본 체크아웃은 merge-preview ref다 — 이 워크플로는
          # 항상 main 자체를 판정해야 한다(방금 merge된 PR이 아니라).
          ref: main
          fetch-depth: 0 # since-last-tag 워크가 전체 히스토리 + 태그를 요구

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Decide
        id: decide
        run: |
          LABELED=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then LABELED=(--labeled); fi
          bun scripts/next-version.mjs "${LABELED[@]}" | tee -a "$GITHUB_OUTPUT"

  release:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.decide.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Tag & publish
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes
